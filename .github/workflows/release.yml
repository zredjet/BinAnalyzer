name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン番号 (例: 1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'true にすると成果物を作って検証するだけで GitHub Release は作成しない'
        required: false
        default: false
        type: boolean

# runner: ubuntu-latest は 2026-10-19 以降 Ubuntu 26.04 へ移行するため、先回りして明示指定する。
#   Linux GUI スモークが依存する libwebkit2gtk-4.1-0 / libnotify4 / xvfb は 26.04 (resolute) にも存在する。
# actions: Node.js 20 ランタイム廃止に伴い、Node.js 24 で動く各アクションのメジャー版へ更新済み
#   (checkout v7 / setup-dotnet v6 / upload-artifact v7 / download-artifact v8 / action-gh-release v3)。
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore BinAnalyzer.slnx

      - name: Build
        run: dotnet build BinAnalyzer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test BinAnalyzer.slnx --no-build --configuration Release --verbosity normal

      # ライセンス一覧は python3 と NuGet API を使うので ubuntu で 1 回だけ生成し、各 OS のパッケージングへ渡す
      - name: Generate third-party licenses
        run: bash scripts/generate-third-party-licenses.sh

      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt

  # 各 RID をネイティブ OS 上で publish する。macOS では SDK が apphost に ad-hoc 署名を付けるので、
  # Apple Silicon で「壊れているため開けません」にならない。GUI を含むので publish 直後に起動スモークも行う。
  build:
    name: Build ${{ matrix.rid }}
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: BinAnalyzer.Cli.exe
            out: binanalyzer.exe
          - os: ubuntu-26.04
            rid: linux-x64
            exe: BinAnalyzer.Cli
            out: binanalyzer
          - os: macos-latest
            rid: osx-arm64
            exe: BinAnalyzer.Cli
            out: binanalyzer
          - os: macos-latest
            rid: osx-x64
            exe: BinAnalyzer.Cli
            out: binanalyzer
    runs-on: ${{ matrix.os }}
    env:
      STAGING_DIR: BinAnalyzer-${{ inputs.version }}-${{ matrix.rid }}
      SAMPLE: testdata/smoke/sample.png
      FORMAT: formats/png.bdef.yaml
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/BinAnalyzer.Cli/BinAnalyzer.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ inputs.version }}
          --output ./publish

      - name: Install WebKitGTK and xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libnotify4 xvfb

      - name: Smoke -o tree
        shell: bash
        run: ./publish/${{ matrix.exe }} "$SAMPLE" -f "$FORMAT" -o tree

      - name: Smoke -o gui (auto-close)
        shell: bash
        env:
          BINANALYZER_GUI_AUTOCLOSE: '3000'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./publish/${{ matrix.exe }} "$SAMPLE" -f "$FORMAT" -o gui
          else
            ./publish/${{ matrix.exe }} "$SAMPLE" -f "$FORMAT" -o gui
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p "$STAGING_DIR"
          cp "./publish/${{ matrix.exe }}" "$STAGING_DIR/${{ matrix.out }}"
          cp -r formats/ "$STAGING_DIR/formats/"
          cp -r schemas/ "$STAGING_DIR/schemas/"
          cp README.md LICENSE THIRD-PARTY-LICENSES.txt "$STAGING_DIR/"
          ls -l "$STAGING_DIR/${{ matrix.out }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$STAGING_DIR.zip" "$STAGING_DIR" > /dev/null
          else
            zip -r "$STAGING_DIR.zip" "$STAGING_DIR"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.STAGING_DIR }}
          path: ${{ env.STAGING_DIR }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: BinAnalyzer-${{ inputs.version }}-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: BinAnalyzer-${{ inputs.version }}-*.zip
          generate_release_notes: true
