# MessagePack
# 仕様: MessagePack specification（msgpack/msgpack spec.md、2017 年のタイムスタンプの拡張型を含む） https://github.com/msgpack/msgpack/blob/master/spec.md 。
#   Python の msgpack 1.1 が出力したデータで照合した
# 構造: 値の並び（ファイルの中の複数の値を順に読む）。値は先頭の 1 バイト（形式）で型と長さが決まり、配列・マップは中に値を再帰的に持つ
# 対応していないもの: タイムスタンプ以外の拡張型の中身（バイト列）、bin の中身の型の推測、マップのキーの重複の検査、
#   2^63 以上の uint 64（DSL の整数が符号付き 64 ビットのため負の値で表示）
name: MessagePack
endianness: big
root: msgpack_root

structs:
  msgpack_root:
    - name: values
      type: struct
      struct: msgpack_value
      repeat: eof
      description: "値の並び"

  # 値。独自の変数のスコープを持たせる（入れ子の値の format_byte などが親の値を上書きしないように）
  msgpack_value:
    scope: isolated
    fields:
      - name: format_byte
        type: uint8
        description: "形式のバイト（型と、fix 系では値・長さを含む）"
      - name: format
        type: virtual
        value: "{format_byte <= 0x7F ? 'positive fixint' : (format_byte <= 0x8F ? 'fixmap' : (format_byte <= 0x9F ? 'fixarray' : (format_byte <= 0xBF ? 'fixstr' : (format_byte >= 0xE0 ? 'negative fixint' : (format_byte == 0xC0 ? 'nil' : (format_byte == 0xC1 ? 'never used' : (format_byte <= 0xC3 ? 'bool' : (format_byte <= 0xC6 ? 'bin' : (format_byte <= 0xC9 ? 'ext' : (format_byte <= 0xCB ? 'float' : (format_byte <= 0xCF ? 'uint' : (format_byte <= 0xD3 ? 'int' : (format_byte <= 0xD8 ? 'fixext' : (format_byte <= 0xDB ? 'str' : (format_byte <= 0xDD ? 'array' : 'map')))))))))))))))}"
        description: "形式の名前"
      - name: data
        type: switch
        switch_on: "{format_byte}"
        cases:
          "0xc0": nil_value
          "0xc2": false_value
          "0xc3": true_value
          "0xc4": bin8_value
          "0xc5": bin16_value
          "0xc6": bin32_value
          "0xc7": ext8_value
          "0xc8": ext16_value
          "0xc9": ext32_value
          "0xca": float32_value
          "0xcb": float64_value
          "0xcc": uint8_value
          "0xcd": uint16_value
          "0xce": uint32_value
          "0xcf": uint64_value
          "0xd0": int8_value
          "0xd1": int16_value
          "0xd2": int32_value
          "0xd3": int64_value
          "0xd4": fixext1_value
          "0xd5": fixext2_value
          "0xd6": fixext4_value
          "0xd7": fixext8_value
          "0xd8": fixext16_value
          "0xd9": str8_value
          "0xda": str16_value
          "0xdb": str32_value
          "0xdc": array16_value
          "0xdd": array32_value
          "0xde": map16_value
          "0xdf": map32_value
        default: fixtype_value
        description: "値"

  fixtype_value:
    - name: value
      type: virtual
      value: "{format_byte}"
      if: "{format_byte <= 0x7F}"
      description: "正の fixint（0〜127）"
    - name: value
      type: virtual
      value: "{format_byte - 256}"
      if: "{format_byte >= 0xE0}"
      description: "負の fixint（-32〜-1）"
    - name: map
      type: struct
      struct: msgpack_map
      if: "{format_byte >= 0x80 and format_byte <= 0x8F}"
      description: "fixmap（下位 4 ビットがエントリ数）"
    - name: array
      type: struct
      struct: msgpack_array
      if: "{format_byte >= 0x90 and format_byte <= 0x9F}"
      description: "fixarray（下位 4 ビットが要素数）"
    - name: text
      type: utf8
      size: "{format_byte - 0xA0}"
      if: "{format_byte >= 0xA0 and format_byte <= 0xBF}"
      description: "fixstr（下位 5 ビットがバイト数）"
    - name: never_used
      type: bytes
      size: "0"
      if: "{format_byte == 0xC1}"
      description: "使われない形式（0xc1）"

  nil_value:
    - name: value
      type: virtual
      value: "{'nil'}"
      description: "nil（値が無い）"

  false_value:
    - name: value
      type: virtual
      value: "{0}"
      description: "偽"

  true_value:
    - name: value
      type: virtual
      value: "{1}"
      description: "真"

  uint8_value:
    - name: value
      type: uint8
      description: "8 ビットの符号なし整数"

  int8_value:
    - name: value
      type: int8
      description: "8 ビットの符号付き整数"

  uint16_value:
    - name: value
      type: uint16
      description: "16 ビットの符号なし整数"

  int16_value:
    - name: value
      type: int16
      description: "16 ビットの符号付き整数"

  uint32_value:
    - name: value
      type: uint32
      description: "32 ビットの符号なし整数"

  int32_value:
    - name: value
      type: int32
      description: "32 ビットの符号付き整数"

  uint64_value:
    - name: value
      type: uint64
      description: "64 ビットの符号なし整数"

  int64_value:
    - name: value
      type: int64
      description: "64 ビットの符号付き整数"

  float32_value:
    - name: value
      type: float32
      description: "単精度の浮動小数点数"

  float64_value:
    - name: value
      type: float64
      description: "倍精度の浮動小数点数"

  str8_value:
    - name: length
      type: uint8
      description: "文字列のバイト数"
    - name: text
      type: utf8
      size: "{length}"
      description: "文字列（UTF-8）"

  bin8_value:
    - name: length
      type: uint8
      description: "バイト列のバイト数"
    - name: data
      type: bytes
      size: "{length}"
      description: "バイト列"

  ext8_value:
    - name: length
      type: uint8
      description: "データのバイト数"
    - name: ext_type
      type: int8
      description: "拡張型の番号（負の値は仕様が予約。-1 はタイムスタンプ）"
    - name: timestamp
      type: struct
      struct: timestamp_ext
      size: "{length}"
      if: "{ext_type == -1}"
      description: "タイムスタンプ（拡張型 -1）"
    - name: data
      type: bytes
      size: "{length}"
      if: "{ext_type != -1}"
      description: "拡張型のデータ"

  str16_value:
    - name: length
      type: uint16
      description: "文字列のバイト数"
    - name: text
      type: utf8
      size: "{length}"
      description: "文字列（UTF-8）"

  bin16_value:
    - name: length
      type: uint16
      description: "バイト列のバイト数"
    - name: data
      type: bytes
      size: "{length}"
      description: "バイト列"

  ext16_value:
    - name: length
      type: uint16
      description: "データのバイト数"
    - name: ext_type
      type: int8
      description: "拡張型の番号（負の値は仕様が予約。-1 はタイムスタンプ）"
    - name: timestamp
      type: struct
      struct: timestamp_ext
      size: "{length}"
      if: "{ext_type == -1}"
      description: "タイムスタンプ（拡張型 -1）"
    - name: data
      type: bytes
      size: "{length}"
      if: "{ext_type != -1}"
      description: "拡張型のデータ"

  str32_value:
    - name: length
      type: uint32
      description: "文字列のバイト数"
    - name: text
      type: utf8
      size: "{length}"
      description: "文字列（UTF-8）"

  bin32_value:
    - name: length
      type: uint32
      description: "バイト列のバイト数"
    - name: data
      type: bytes
      size: "{length}"
      description: "バイト列"

  ext32_value:
    - name: length
      type: uint32
      description: "データのバイト数"
    - name: ext_type
      type: int8
      description: "拡張型の番号（負の値は仕様が予約。-1 はタイムスタンプ）"
    - name: timestamp
      type: struct
      struct: timestamp_ext
      size: "{length}"
      if: "{ext_type == -1}"
      description: "タイムスタンプ（拡張型 -1）"
    - name: data
      type: bytes
      size: "{length}"
      if: "{ext_type != -1}"
      description: "拡張型のデータ"

  fixext1_value:
    - name: ext_type
      type: int8
      description: "拡張型の番号（負の値は仕様が予約。-1 はタイムスタンプ）"
    - name: timestamp
      type: struct
      struct: timestamp_ext
      size: "1"
      if: "{ext_type == -1}"
      description: "タイムスタンプ（拡張型 -1）"
    - name: data
      type: bytes
      size: "1"
      if: "{ext_type != -1}"
      description: "拡張型のデータ"

  fixext2_value:
    - name: ext_type
      type: int8
      description: "拡張型の番号（負の値は仕様が予約。-1 はタイムスタンプ）"
    - name: timestamp
      type: struct
      struct: timestamp_ext
      size: "2"
      if: "{ext_type == -1}"
      description: "タイムスタンプ（拡張型 -1）"
    - name: data
      type: bytes
      size: "2"
      if: "{ext_type != -1}"
      description: "拡張型のデータ"

  fixext4_value:
    - name: ext_type
      type: int8
      description: "拡張型の番号（負の値は仕様が予約。-1 はタイムスタンプ）"
    - name: timestamp
      type: struct
      struct: timestamp_ext
      size: "4"
      if: "{ext_type == -1}"
      description: "タイムスタンプ（拡張型 -1）"
    - name: data
      type: bytes
      size: "4"
      if: "{ext_type != -1}"
      description: "拡張型のデータ"

  fixext8_value:
    - name: ext_type
      type: int8
      description: "拡張型の番号（負の値は仕様が予約。-1 はタイムスタンプ）"
    - name: timestamp
      type: struct
      struct: timestamp_ext
      size: "8"
      if: "{ext_type == -1}"
      description: "タイムスタンプ（拡張型 -1）"
    - name: data
      type: bytes
      size: "8"
      if: "{ext_type != -1}"
      description: "拡張型のデータ"

  fixext16_value:
    - name: ext_type
      type: int8
      description: "拡張型の番号（負の値は仕様が予約。-1 はタイムスタンプ）"
    - name: timestamp
      type: struct
      struct: timestamp_ext
      size: "16"
      if: "{ext_type == -1}"
      description: "タイムスタンプ（拡張型 -1）"
    - name: data
      type: bytes
      size: "16"
      if: "{ext_type != -1}"
      description: "拡張型のデータ"

  array16_value:
    - name: count
      type: uint16
      description: "要素数"
    - name: array
      type: struct
      struct: msgpack_array
      description: "配列"

  map16_value:
    - name: count
      type: uint16
      description: "エントリ数"
    - name: map
      type: struct
      struct: msgpack_map
      description: "マップ"

  array32_value:
    - name: count
      type: uint32
      description: "要素数"
    - name: array
      type: struct
      struct: msgpack_array
      description: "配列"

  map32_value:
    - name: count
      type: uint32
      description: "エントリ数"
    - name: map
      type: struct
      struct: msgpack_map
      description: "マップ"

  # 配列とマップも独自のスコープを持たせる（要素の値がこの値の変数と混ざらないように）
  msgpack_array:
    scope: isolated
    fields:
      - name: elements
        type: struct
        struct: msgpack_value
        repeat_count: "{format_byte >= 0x90 and format_byte <= 0x9F ? format_byte - 0x90 : count}"
        description: "要素の並び"

  msgpack_map:
    scope: isolated
    fields:
      - name: entries
        type: struct
        struct: map_entry
        repeat_count: "{format_byte >= 0x80 and format_byte <= 0x8F ? format_byte - 0x80 : count}"
        description: "エントリ（キーと値）の並び"

  map_entry:
    - name: key
      type: struct
      struct: msgpack_value
      description: "キー"
    - name: value
      type: struct
      struct: msgpack_value
      description: "値"

  timestamp_ext:
    - name: seconds32
      type: uint32
      if: "{remaining == 4}"
      description: "1970-01-01 からの秒（timestamp 32）"
    - name: nsec_sec34
      type: bitfield
      size: "8"
      if: "{remaining == 8}"
      description: "ナノ秒 30 ビット + 秒 34 ビット（timestamp 64）"
      fields:
        - name: nanoseconds30
          bits: "63:34"
          description: "ナノ秒"
        - name: seconds34
          bits: "33:0"
          description: "1970-01-01 からの秒"
    - name: nanoseconds32
      type: uint32
      if: "{remaining == 12}"
      description: "ナノ秒（timestamp 96）"
    - name: seconds64
      type: int64
      if: "{remaining == 8}"
      description: "1970-01-01 からの秒（timestamp 96。負の値は 1970 年より前）"
    - name: extra
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      description: "タイムスタンプの形に合わない残り"
