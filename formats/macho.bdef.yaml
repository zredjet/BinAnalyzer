# Mach-O（macOS / iOS の実行ファイル・動的ライブラリ・オブジェクトファイル・バンドル。ユニバーサルバイナリを含む）
# 仕様: Apple の XNU / cctools の公開ヘッダ（mach-o/loader.h・mach-o/fat.h・mach-o/nlist.h、macOS 26 SDK）と
#   コード署名の構造（xnu の osfmk/kern/cs_blobs.h）。Apple の公式文書「OS X ABI Mach-O File Format Reference」は更新が止まっているため、ヘッダの定義を正とした
# 構造: 先頭 4 バイトのマジックで switch する。ユニバーサルバイナリ（fat。ビッグエンディアン）は fat_arch の表から各スライスへ seek し、
#   スライスの中を 1 つの Mach-O として読む（スライス内の位置はスライスの先頭 slice_offset からの相対）。
#   Mach-O はマジックでエンディアン（MH_CIGAM ならビッグ）と 32 / 64 ビットを決め、ヘッダ → ロードコマンド（cmd で switch）を読む。
#   LC_SYMTAB のシンボル表と LC_CODE_SIGNATURE のコード署名（SuperBlob。ビッグエンディアン）は、ロードコマンドを読んだ後に
#   値の昇格で得た位置へ seek して読む（シンボル名は文字列表から引く）。
# 対応していないもの: セクションの中身、再配置・間接シンボル表・dyld の情報（rebase / bind / export trie / chained fixups）の中身、
#   LC_THREAD のレジスタの状態の分解、要件（Requirements）と CMS の署名の中身、CodeDirectory のハッシュの一覧の検証、
#   dyld の共有キャッシュ、アーカイブ（.a）
name: Mach-O
endianness: little
root: macho

enums:
  magic:
    - value: 0xFEEDFACE
      label: MH_MAGIC
      description: "32 ビット（ファイルと同じエンディアン）"
