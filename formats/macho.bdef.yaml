        bit: 22
      - name: MH_HAS_TLV_DESCRIPTORS
        bit: 23
      - name: MH_NO_HEAP_EXECUTION
        bit: 24
      - name: MH_APP_EXTENSION_SAFE
        bit: 25
      - name: MH_NLIST_OUTOFSYNC_WITH_DYLDINFO
        bit: 26
      - name: MH_SIM_SUPPORT
        bit: 27
      - name: MH_IMPLICIT_PAGEZERO
        bit: 28
      - name: MH_DYLIB_IN_CACHE
        bit: 31

  vm_prot:
    bit_size: 32
    fields:
      - name: VM_PROT_READ
        bit: 0
      - name: VM_PROT_WRITE
        bit: 1
      - name: VM_PROT_EXECUTE
        bit: 2

  section_attributes:
    bit_size: 32
    fields:
      - name: S_ATTR_LOC_RELOC
        bit: 8
      - name: S_ATTR_EXT_RELOC
        bit: 9
      - name: S_ATTR_SOME_INSTRUCTIONS
        bit: 10
      - name: S_ATTR_DEBUG
        bit: 25
      - name: S_ATTR_SELF_MODIFYING_CODE
        bit: 26
      - name: S_ATTR_LIVE_SUPPORT
        bit: 27
      - name: S_ATTR_NO_DEAD_STRIP
        bit: 28
      - name: S_ATTR_STRIP_STATIC_SYMS
        bit: 29
      - name: S_ATTR_NO_TOC
        bit: 30
      - name: S_ATTR_PURE_INSTRUCTIONS
        bit: 31

structs:
  macho:
    - name: slice_offset
      type: virtual
      value: "0"
      description: "この Mach-O の先頭の位置（ファイル先頭。ユニバーサルバイナリのスライスではスライスの先頭）"
    - name: magic
      type: uint32
      enum: magic
      description: "マジック（Mach-O の 32 / 64 ビットとエンディアン、またはユニバーサルバイナリ）"
    - name: body
      type: switch
      switch_on: "{magic}"
      cases:
        "0xFEEDFACE": mach_image
        "0xCEFAEDFE": mach_image
        "0xFEEDFACF": mach_image
        "0xCFFAEDFE": mach_image
        "0xBEBAFECA": fat_binary
        "0xBFBAFECA": fat_binary64
      default: raw_data
      description: "マジック以降（Mach-O のヘッダ、またはユニバーサルバイナリのアーキテクチャの表）"

  # ===== ユニバーサルバイナリ =====
  fat_binary:
    endianness: big
    fields:
      - name: nfat_arch
        type: uint32
        description: "スライス（アーキテクチャ）の数"
      - name: archs
        type: struct
        struct: fat_arch
        repeat_count: "{nfat_arch}"
        description: "スライスの表（20 バイトずつ）と各スライスの中身"

  fat_arch:
    - name: cputype
      type: uint32
      enum: cpu_type
      description: "スライスの CPU の種類"
    - name: cpusubtype
      type: uint32
      description: "スライスの CPU の細分（下位 24 ビット。ARM64 なら 2 = arm64e）"
    - name: offset
      type: uint32
      description: "スライスの位置（ファイル先頭から）"
    - name: size
      type: uint32
      description: "スライスのバイト数"
    - name: align
      type: uint32
      description: "スライスのアラインメント（2 のべき指数。14 = 16 KiB）"
    - name: image
      type: struct
      struct: fat_slice
      seek: "{offset}"
      seek_restore: true
      size: "{size}"
      description: "スライスの中の Mach-O"

  fat_binary64:
    endianness: big
    fields:
      - name: nfat_arch
        type: uint32
        description: "スライス（アーキテクチャ）の数"
      - name: archs
        type: struct
        struct: fat_arch64
        repeat_count: "{nfat_arch}"
        description: "スライスの表（32 バイトずつ）と各スライスの中身"

  fat_arch64:
    - name: cputype
      type: uint32
      enum: cpu_type
      description: "スライスの CPU の種類"
    - name: cpusubtype
      type: uint32
      description: "スライスの CPU の細分"
    - name: offset
      type: uint64
      description: "スライスの位置（ファイル先頭から）"
    - name: size
      type: uint64
      description: "スライスのバイト数"
    - name: align
      type: uint32
      description: "スライスのアラインメント（2 のべき指数）"
    - name: reserved
      type: uint32
      description: "予約（0）"
    - name: image
      type: struct
      struct: fat_slice
      seek: "{offset}"
      seek_restore: true
      size: "{size}"
      description: "スライスの中の Mach-O"

  fat_slice:
    endianness: little
    fields:
      - name: slice_offset
        type: virtual
        value: "{offset}"
        description: "スライスの先頭の位置（スライスの中の位置はここからの相対）"
      - name: magic
        type: uint32
        enum: magic
        description: "スライスの Mach-O のマジック"
      - name: body
        type: switch
        switch_on: "{magic}"
        cases:
          "0xFEEDFACE": mach_image
          "0xCEFAEDFE": mach_image
          "0xFEEDFACF": mach_image
          "0xCFFAEDFE": mach_image
        default: raw_data
        description: "スライスの Mach-O のヘッダ以降"

  # ===== Mach-O 本体 =====
  mach_image:
    endianness: "{(magic == 0xCEFAEDFE or magic == 0xCFFAEDFE) ? 'big' : 'little'}"
    fields:
      - name: is_64
        type: virtual
        value: "{magic == 0xFEEDFACF or magic == 0xCFFAEDFE ? 1 : 0}"
        description: "64 ビットの Mach-O か（ヘッダの予約フィールドとシンボルの幅が変わる）"
      - name: cputype
        type: uint32
        enum: cpu_type
        description: "CPU の種類（上位 8 ビットは ABI のフラグ。0x01 = 64 ビット、0x02 = 64 ビットで 32 ビットポインタ）"
      - name: cpusubtype
        type: uint32
        description: "CPU の細分（下位 24 ビット）と機能のビット（上位 8 ビット。arm64e のポインタ認証の版など）"
      - name: cpu_subtype_value
        type: virtual
        value: "{cpusubtype & 0x00FFFFFF}"
        description: "CPU の細分（ARM64: 0 = すべて、1 = v8、2 = arm64e。x86-64: 3 = すべて、8 = Haswell）"
      - name: filetype
        type: uint32
        enum: file_type
        description: "ファイルの種類"
      - name: ncmds
        type: uint32
        description: "ロードコマンドの数"
      - name: sizeofcmds
        type: uint32
        description: "ロードコマンドの合計バイト数"
      - name: flags
        type: uint32
        flags: mh_flags
        description: "ヘッダのフラグ（MH_PIE = 位置独立、MH_TWOLEVEL = 2 レベル名前空間、MH_DYLDLINK = dyld で読み込む など）"
      - name: reserved
        type: uint32
        if: "{is_64 == 1}"
        description: "予約（64 ビットのヘッダのみ。0）"
      - name: symoff
        type: virtual
        value: "0"
        description: "シンボル表の位置の初期値（LC_SYMTAB があれば置き換わる）"
      - name: nsyms
        type: virtual
        value: "0"
        description: "シンボルの数の初期値（LC_SYMTAB があれば置き換わる）"
      - name: stroff
        type: virtual
        value: "0"
        description: "文字列表の位置の初期値（LC_SYMTAB があれば置き換わる）"
      - name: signature_offset
        type: virtual
        value: "0"
        description: "コード署名の位置の初期値（LC_CODE_SIGNATURE があれば置き換わる）"
      - name: signature_size
        type: virtual
        value: "0"
        description: "コード署名のバイト数の初期値（LC_CODE_SIGNATURE があれば置き換わる）"
      - name: load_commands
        type: struct
        struct: load_command
        repeat_count: "{ncmds}"
        description: "ロードコマンド（ncmds 個。種類 + バイト数 + 本体）"
      - name: symbol_table
        type: switch
        switch_on: "{is_64}"
        seek: "{slice_offset + symoff}"
        seek_restore: true
        if: "{nsyms > 0}"
        cases:
          "1": symbol_table_64
        default: symbol_table_32
        description: "シンボル表（LC_SYMTAB の symoff の位置の nsyms 個）"
      - name: code_signature
        type: struct
        struct: code_signature
        seek: "{slice_offset + signature_offset}"
        seek_restore: true
        if: "{signature_size > 0}"
        description: "コード署名（LC_CODE_SIGNATURE の位置の SuperBlob。ビッグエンディアン）"

  load_command:
    - name: cmd
      type: uint32
      enum: lc_type
      description: "ロードコマンドの種類（0x80000000 = LC_REQ_DYLD が立っていれば、dyld が知らないと読み込みが失敗する）"
    - name: cmdsize
      type: uint32
      description: "このロードコマンドのバイト数（cmd と cmdsize を含む。8 の倍数）"
    - name: body
      type: switch
      switch_on: "{cmd}"
      size: "{cmdsize - 8}"
      cases:
        "0x1": segment_32_body
        "0x19": segment_64_body
        "0x2": symtab_body
        "0xB": dysymtab_body
        "0xC": dylib_body
        "0xD": dylib_body
        "0x80000018": dylib_body
        "0x8000001F": dylib_body
        "0x20": dylib_body
        "0x80000023": dylib_body
        "0xE": lc_str_body
        "0xF": lc_str_body
        "0x27": lc_str_body
        "0x8000001C": lc_str_body
        "0x12": lc_str_body
        "0x13": lc_str_body
        "0x14": lc_str_body
        "0x15": lc_str_body
        "0x1B": uuid_body
        "0x1D": code_signature_command_body
        "0x1E": linkedit_data_body
        "0x26": linkedit_data_body
        "0x29": linkedit_data_body
        "0x2B": linkedit_data_body
        "0x2E": linkedit_data_body
        "0x80000033": linkedit_data_body
        "0x80000034": linkedit_data_body
        "0x36": linkedit_data_body
        "0x37": linkedit_data_body
        "0x38": linkedit_data_body
        "0x22": dyld_info_body
        "0x80000022": dyld_info_body
        "0x24": version_min_body
        "0x25": version_min_body
        "0x2F": version_min_body
        "0x30": version_min_body
        "0x32": build_version_body
        "0x2A": source_version_body
        "0x80000028": main_body
        "0x21": encryption_info_body
        "0x2C": encryption_info_64_body
        "0x2D": linker_option_body
        "0x31": note_body
        "0x80000035": fileset_entry_body
        "0x39": lc_str_body
      default: raw_data
      description: "ロードコマンドの本体（cmdsize − 8 バイト。種類で振り分ける）"

  segment_64_body:
    - name: segname
      type: ascii
      size: "16"
      description: "セグメント名（__PAGEZERO・__TEXT・__DATA・__LINKEDIT など）"
    - name: vmaddr
      type: uint64
      description: "セグメントの仮想アドレス"
    - name: vmsize
      type: uint64
      description: "セグメントのメモリ上のバイト数"
    - name: fileoff
      type: uint64
      description: "セグメントのファイル上の位置（スライスの先頭から）"
    - name: filesize
      type: uint64
      description: "セグメントのファイル上のバイト数"
    - name: maxprot
      type: uint32
      flags: vm_prot
      description: "許される最大のアクセス権"
    - name: initprot
      type: uint32
      flags: vm_prot
      description: "最初のアクセス権"
    - name: nsects
      type: uint32
      description: "セクションの数"
    - name: flags
      type: uint32
      description: "セグメントのフラグ（0x1 = SG_HIGHVM、0x4 = SG_NORELOC、0x8 = SG_PROTECTED_VERSION_1、0x10 = SG_READ_ONLY）"
    - name: sections
      type: struct
      struct: section_64
      repeat_count: "{nsects}"
      description: "セクション（80 バイトずつ）"

  section_64:
    - name: sectname
      type: ascii
      size: "16"
      description: "セクション名（__text・__cstring・__const など）"
    - name: segname
      type: ascii
      size: "16"
      description: "属するセグメント名"
    - name: addr
      type: uint64
      description: "セクションの仮想アドレス"
    - name: size
      type: uint64
      description: "セクションのバイト数"
    - name: offset
      type: uint32
      description: "セクションのファイル上の位置（0 埋めのセクションは 0）"
    - name: align
      type: uint32
      description: "アラインメント（2 のべき指数）"
    - name: reloff
      type: uint32
      description: "再配置のエントリの位置（.o のみ）"
    - name: nreloc
      type: uint32
      description: "再配置のエントリの数"
    - name: flags
      type: uint32
      flags: section_attributes
      description: "セクションの種類（下位 8 ビット）と属性（上位 24 ビット）"
    - name: section_type
      type: virtual
      value: "{flags & 0xFF}"
      enum: section_type
      description: "セクションの種類（flags の下位 8 ビット）"
    - name: reserved1
      type: uint32
      description: "種類ごとの値（シンボルのポインタ・スタブなら間接シンボル表の開始番号）"
    - name: reserved2
      type: uint32
      description: "種類ごとの値（スタブならスタブ 1 個のバイト数）"
    - name: reserved3
      type: uint32
      description: "予約（0）"

  segment_32_body:
    - name: segname
      type: ascii
      size: "16"
      description: "セグメント名（__TEXT・__DATA など）"
    - name: vmaddr
      type: uint32
      description: "セグメントの仮想アドレス"
    - name: vmsize
      type: uint32
      description: "セグメントのメモリ上のバイト数"
    - name: fileoff
      type: uint32
      description: "セグメントのファイル上の位置"
    - name: filesize
      type: uint32
      description: "セグメントのファイル上のバイト数"
    - name: maxprot
      type: uint32
      flags: vm_prot
      description: "許される最大のアクセス権"
    - name: initprot
      type: uint32
      flags: vm_prot
      description: "最初のアクセス権"
    - name: nsects
      type: uint32
      description: "セクションの数"
    - name: flags
      type: uint32
      description: "セグメントのフラグ"
    - name: sections
      type: struct
      struct: section_32
      repeat_count: "{nsects}"
      description: "セクション（68 バイトずつ）"

  section_32:
    - name: sectname
      type: ascii
      size: "16"
      description: "セクション名"
    - name: segname
      type: ascii
      size: "16"
      description: "属するセグメント名"
    - name: addr
      type: uint32
      description: "セクションの仮想アドレス"
    - name: size
      type: uint32
      description: "セクションのバイト数"
    - name: offset
      type: uint32
      description: "セクションのファイル上の位置"
    - name: align
      type: uint32
      description: "アラインメント（2 のべき指数）"
    - name: reloff
      type: uint32
      description: "再配置のエントリの位置"
    - name: nreloc
      type: uint32
      description: "再配置のエントリの数"
    - name: flags
      type: uint32
      flags: section_attributes
      description: "セクションの種類（下位 8 ビット）と属性（上位 24 ビット）"
    - name: section_type
      type: virtual
      value: "{flags & 0xFF}"
      enum: section_type
      description: "セクションの種類（flags の下位 8 ビット）"
    - name: reserved1
      type: uint32
      description: "種類ごとの値"
    - name: reserved2
      type: uint32
      description: "種類ごとの値"

  symtab_body:
    - name: symoff
      type: uint32
      description: "シンボル表の位置（スライスの先頭から）"
    - name: nsyms
      type: uint32
      description: "シンボルの数"
    - name: stroff
      type: uint32
      description: "文字列表の位置（スライスの先頭から）"
    - name: strsize
      type: uint32
      description: "文字列表のバイト数"

  dysymtab_body:
    - name: ilocalsym
      type: uint32
      description: "ローカルシンボルの開始番号"
    - name: nlocalsym
      type: uint32
      description: "ローカルシンボルの数"
    - name: iextdefsym
      type: uint32
      description: "外部に公開する定義済みシンボルの開始番号"
    - name: nextdefsym
      type: uint32
      description: "外部に公開する定義済みシンボルの数"
    - name: iundefsym
      type: uint32
      description: "未定義シンボルの開始番号"
    - name: nundefsym
      type: uint32
      description: "未定義シンボルの数"
    - name: tocoff
      type: uint32
      description: "目次の位置（動的ライブラリの古い形式）"
    - name: ntoc
      type: uint32
      description: "目次のエントリの数"
    - name: modtaboff
      type: uint32
      description: "モジュール表の位置"
    - name: nmodtab
      type: uint32
      description: "モジュール表のエントリの数"
    - name: extrefsymoff
      type: uint32
      description: "参照シンボル表の位置"
    - name: nextrefsyms
      type: uint32
      description: "参照シンボル表のエントリの数"
    - name: indirectsymoff
      type: uint32
      description: "間接シンボル表の位置（スタブ・GOT とシンボルの対応）"
    - name: nindirectsyms
      type: uint32
      description: "間接シンボル表のエントリの数"
    - name: extreloff
      type: uint32
      description: "外部の再配置の位置"
    - name: nextrel
      type: uint32
      description: "外部の再配置の数"
    - name: locreloff
      type: uint32
      description: "ローカルの再配置の位置"
    - name: nlocrel
      type: uint32
      description: "ローカルの再配置の数"

  dylib_body:
    - name: name_offset
      type: uint32
      description: "ライブラリ名の位置（ロードコマンドの先頭から。通常 24）"
    - name: timestamp
      type: uint32
      description: "ライブラリの作成日時（通常 2 などの固定値）"
    - name: current_version
      type: uint32
      description: "ライブラリの現在の版（上位 16 ビット.次の 8 ビット.下位 8 ビット）"
    - name: current_version_text
      type: virtual
      value: "{concat(current_version >> 16, '.', (current_version >> 8) & 0xFF, '.', current_version & 0xFF)}"
      description: "現在の版（X.Y.Z）"
    - name: compatibility_version
      type: uint32
      description: "互換性のある最も古い版（current_version と同じ表し方）"
    - name: compatibility_version_text
      type: virtual
      value: "{concat(compatibility_version >> 16, '.', (compatibility_version >> 8) & 0xFF, '.', compatibility_version & 0xFF)}"
      description: "互換性のある版（X.Y.Z）"
    - name: name_padding_before
      type: bytes
      size: "{name_offset - 24}"
      if: "{name_offset > 24}"
      padding: true
      description: "ライブラリ名の前の余白"
    - name: name
      type: asciiz
      description: "ライブラリのパス（例: /usr/lib/libSystem.B.dylib、@rpath/...）"
    - name: name_padding
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      padding: true
      description: "ロードコマンドを 8 バイトの倍数にそろえる詰め物（0）"

  lc_str_body:
    - name: name_offset
      type: uint32
      description: "文字列の位置（ロードコマンドの先頭から。通常 12）"
    - name: name_padding_before
      type: bytes
      size: "{name_offset - 12}"
      if: "{name_offset > 12}"
      padding: true
      description: "文字列の前の余白"
    - name: name
      type: asciiz
      description: "文字列（動的リンカのパス・@rpath の検索パス・フレームワーク名・環境変数・ターゲットトリプルなど）"
    - name: name_padding
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      padding: true
      description: "ロードコマンドを 8 バイトの倍数にそろえる詰め物（0）"

  uuid_body:
    - name: uuid
      type: bytes
      size: "16"
      description: "イメージの UUID（ビルドごとに一意。dSYM との対応に使う）"

  code_signature_command_body:
    - name: signature_offset
      type: uint32
      description: "コード署名の位置（__LINKEDIT の中。スライスの先頭から）"
    - name: signature_size
      type: uint32
      description: "コード署名のバイト数"

  linkedit_data_body:
    - name: dataoff
      type: uint32
      description: "データの位置（__LINKEDIT の中。スライスの先頭から）"
    - name: datasize
      type: uint32
      description: "データのバイト数"

  dyld_info_body:
    - name: rebase_off
      type: uint32
      description: "リベースの情報の位置"
    - name: rebase_size
      type: uint32
      description: "リベースの情報のバイト数"
    - name: bind_off
      type: uint32
      description: "バインドの情報の位置"
    - name: bind_size
      type: uint32
      description: "バインドの情報のバイト数"
    - name: weak_bind_off
      type: uint32
      description: "弱いバインドの情報の位置"
    - name: weak_bind_size
      type: uint32
      description: "弱いバインドの情報のバイト数"
    - name: lazy_bind_off
      type: uint32
      description: "遅延バインドの情報の位置"
    - name: lazy_bind_size
      type: uint32
      description: "遅延バインドの情報のバイト数"
    - name: export_off
      type: uint32
      description: "エクスポートの trie の位置"
    - name: export_size
      type: uint32
      description: "エクスポートの trie のバイト数"

  version_min_body:
    - name: version
      type: uint32
      description: "対象の OS の最低の版（上位 16 ビット.次の 8 ビット.下位 8 ビット）"
    - name: version_text
      type: virtual
      value: "{concat(version >> 16, '.', (version >> 8) & 0xFF, '.', version & 0xFF)}"
      description: "対象の OS の最低の版（X.Y.Z）"
    - name: sdk
      type: uint32
      description: "ビルドに使った SDK の版（version と同じ表し方）"

  build_version_body:
    - name: platform
      type: uint32
      enum: platform
      description: "対象のプラットフォーム"
    - name: minos
      type: uint32
      description: "対象の OS の最低の版（上位 16 ビット.次の 8 ビット.下位 8 ビット）"
    - name: minos_text
      type: virtual
      value: "{concat(minos >> 16, '.', (minos >> 8) & 0xFF, '.', minos & 0xFF)}"
      description: "対象の OS の最低の版（X.Y.Z）"
    - name: sdk
      type: uint32
      description: "ビルドに使った SDK の版（minos と同じ表し方）"
    - name: sdk_text
      type: virtual
      value: "{concat(sdk >> 16, '.', (sdk >> 8) & 0xFF, '.', sdk & 0xFF)}"
      description: "SDK の版（X.Y.Z）"
    - name: ntools
      type: uint32
      description: "ビルドツールの数"
    - name: tools
      type: struct
      struct: build_tool_entry
      repeat_count: "{ntools}"
      description: "ビルドツールと版"

  build_tool_entry:
    - name: tool
      type: uint32
      enum: build_tool
      description: "ビルドツールの種類"
    - name: version
      type: uint32
      description: "ツールの版（上位 16 ビット.次の 8 ビット.下位 8 ビット）"

  source_version_body:
    - name: version
      type: uint64
      description: "ソースの版（A.B.C.D.E を 24.10.10.10.10 ビットに詰めた値）"
    - name: version_text
      type: virtual
      value: "{concat(version >> 40, '.', (version >> 30) & 0x3FF, '.', (version >> 20) & 0x3FF, '.', (version >> 10) & 0x3FF, '.', version & 0x3FF)}"
      description: "ソースの版（A.B.C.D.E）"

  main_body:
    - name: entryoff
      type: uint64
      description: "main のファイル上の位置（__TEXT の先頭から）"
    - name: stacksize
      type: uint64
      description: "初期スレッドのスタックサイズ（0 なら既定）"

  encryption_info_body:
    - name: cryptoff
      type: uint32
      description: "暗号化された範囲の位置"
    - name: cryptsize
      type: uint32
      description: "暗号化された範囲のバイト数"
    - name: cryptid
      type: uint32
      description: "暗号化の方式（0 = 暗号化されていない）"

  encryption_info_64_body:
    - name: cryptoff
      type: uint32
      description: "暗号化された範囲の位置"
    - name: cryptsize
      type: uint32
      description: "暗号化された範囲のバイト数"
    - name: cryptid
      type: uint32
      description: "暗号化の方式（0 = 暗号化されていない）"
    - name: pad
      type: uint32
      description: "8 バイト境界にそろえる詰め物（0）"

  linker_option_body:
    - name: count
      type: uint32
      description: "文字列の数"
    - name: options
      type: asciiz
      repeat_count: "{count}"
      description: "リンカへのオプション（例: '-lz'、'-framework' 'Foundation'）"
    - name: padding
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      padding: true
      description: "ロードコマンドを 8 バイトの倍数にそろえる詰め物（0）"

  note_body:
    - name: data_owner
      type: ascii
      size: "16"
      description: "データの所有者の名前"
    - name: offset
      type: uint64
      description: "データの位置"
    - name: size
      type: uint64
      description: "データのバイト数"

  fileset_entry_body:
    - name: vmaddr
      type: uint64
      description: "中の Mach-O の仮想アドレス"
    - name: fileoff
      type: uint64
      description: "中の Mach-O の位置"
    - name: entry_id_offset
      type: uint32
      description: "エントリ名の位置（ロードコマンドの先頭から）"
    - name: reserved
      type: uint32
      description: "予約（0）"
    - name: entry_id
      type: asciiz
      description: "エントリ名（カーネル拡張のバンドル ID など）"
    - name: padding
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      padding: true
      description: "ロードコマンドを 8 バイトの倍数にそろえる詰め物（0）"

  # ===== シンボル表 =====
  symbol_table_64:
    - name: symbols
      type: struct
      struct: nlist_64
      repeat_count: "{nsyms}"
      description: "シンボル（16 バイトずつ）"

  nlist_64:
    - name: n_strx
      type: uint32
      description: "シンボル名（文字列表の中のオフセット）"
    - name: name
      type: asciiz
      seek: "{slice_offset + stroff + n_strx}"
      seek_restore: true
      if: "{n_strx != 0}"
      description: "シンボル名（文字列表から引いた文字列。C の関数は先頭に '_' が付く）"
    - name: n_type
      type: uint8
      description: "種類（N_STAB = 0xE0 のビットがあればデバッグ用、N_PEXT = 0x10、N_TYPE = 0x0E、N_EXT = 0x01）"
    - name: symbol_type
      type: virtual
      value: "{n_type & 0x0E}"
      enum: nlist_type
      if: "{(n_type & 0xE0) == 0}"
      description: "シンボルの種類（n_type の N_TYPE のビット。デバッグ用でないとき）"
    - name: is_external
      type: virtual
      value: "{n_type & 0x01}"
      description: "外部シンボルか（N_EXT）"
    - name: n_sect
      type: uint8
      description: "定義されているセクションの番号（1 から。0 = NO_SECT）"
    - name: n_desc
      type: uint16
      description: "追加の情報（未定義シンボルなら上位 8 ビットがライブラリの番号、N_WEAK_REF・N_WEAK_DEF などのフラグ）"
    - name: n_value
      type: uint64
      description: "値（定義済みシンボルならアドレス）"

  symbol_table_32:
    - name: symbols
      type: struct
      struct: nlist_32
      repeat_count: "{nsyms}"
      description: "シンボル（12 バイトずつ）"

  nlist_32:
    - name: n_strx
      type: uint32
      description: "シンボル名（文字列表の中のオフセット）"
    - name: name
      type: asciiz
      seek: "{slice_offset + stroff + n_strx}"
      seek_restore: true
      if: "{n_strx != 0}"
      description: "シンボル名（文字列表から引いた文字列）"
    - name: n_type
      type: uint8
      description: "種類（N_STAB / N_PEXT / N_TYPE / N_EXT のビット）"
    - name: symbol_type
      type: virtual
      value: "{n_type & 0x0E}"
      enum: nlist_type
      if: "{(n_type & 0xE0) == 0}"
      description: "シンボルの種類（n_type の N_TYPE のビット。デバッグ用でないとき）"
    - name: is_external
      type: virtual
      value: "{n_type & 0x01}"
      description: "外部シンボルか（N_EXT）"
    - name: n_sect
      type: uint8
      description: "定義されているセクションの番号（1 から。0 = NO_SECT）"
    - name: n_desc
      type: uint16
      description: "追加の情報（ライブラリの番号・弱い参照のフラグなど）"
    - name: n_value
      type: uint32
      description: "値（定義済みシンボルならアドレス）"

  # ===== コード署名（ビッグエンディアン） =====
  code_signature:
    endianness: big
    fields:
      - name: signature_start
        type: virtual
        value: "{slice_offset + signature_offset}"
        description: "SuperBlob の先頭の位置（ファイル先頭から）"
      - name: magic
        type: uint32
        enum: cs_magic
        validate: "{magic == 0xFADE0CC0}"
        description: "SuperBlob のマジック（CSMAGIC_EMBEDDED_SIGNATURE）"
      - name: length
        type: uint32
        description: "SuperBlob 全体のバイト数"
      - name: count
        type: uint32
        description: "Blob の数"
      - name: index
        type: struct
        struct: cs_blob_index
        repeat_count: "{count}"
        description: "Blob の索引（種類 + 位置）"
      - name: blobs
        type: struct
        struct: cs_blob
        repeat_count: "{count}"
        seek: "{signature_start + index[_index].offset}"
        seek_restore: true
        description: "Blob（索引の順。CodeDirectory・要件・エンタイトルメント・CMS の署名）"

  cs_blob_index:
    - name: slot_type
      type: uint32
      enum: cs_slot
      description: "Blob の種類（スロット番号）"
    - name: offset
      type: uint32
      description: "Blob の位置（SuperBlob の先頭から）"

  cs_blob:
    - name: blob_start
      type: virtual
      value: "{signature_start + index[_index].offset}"
      description: "この Blob の先頭の位置（ファイル先頭から）"
    - name: magic
      type: uint32
      enum: cs_magic
      description: "Blob の種類"
    - name: length
      type: uint32
      description: "Blob のバイト数（magic と length を含む）"
    - name: body
      type: switch
      switch_on: "{magic}"
      size: "{length - 8}"
      cases:
        "0xFADE0C02": code_directory
        "0xFADE7171": entitlements
      default: raw_data
      description: "Blob の本体（CodeDirectory とエンタイトルメントを分解する）"

  code_directory:
    - name: version
      type: uint32
      description: "CodeDirectory の版（0x20400 以上で実行セグメントの情報がある）"
    - name: flags
      type: uint32
      description: "署名のフラグ（0x2 = adhoc、0x10000 = runtime（Hardened Runtime）、0x20000 = linker-signed など）"
    - name: hash_offset
      type: uint32
      description: "コードのハッシュの並びの位置（CodeDirectory の先頭から。特別なスロットのハッシュはこの手前）"
    - name: ident_offset
      type: uint32
      description: "識別子の文字列の位置（CodeDirectory の先頭から）"
    - name: n_special_slots
      type: uint32
      description: "特別なスロット（Info.plist・要件・エンタイトルメントなど）のハッシュの数"
    - name: n_code_slots
      type: uint32
      description: "コードのページのハッシュの数"
    - name: code_limit
      type: uint32
      description: "署名の対象の範囲（スライスの先頭からのバイト数）"
    - name: hash_size
      type: uint8
      description: "ハッシュ 1 個のバイト数"
    - name: hash_type
      type: uint8
      enum: cs_hash_type
      description: "ハッシュの方式"
    - name: platform
      type: uint8
      description: "プラットフォームのバイナリなら 0 以外"
    - name: page_size
      type: uint8
      description: "ページサイズ（2 のべき指数。12 = 4 KiB、14 = 16 KiB）"
    - name: spare2
      type: uint32
      description: "予約（0）"
    - name: scatter_offset
      type: uint32
      if: "{version >= 0x20100}"
      description: "散在したページの表の位置（0 なら無し。版 0x20100 以降）"
    - name: team_offset
      type: uint32
      if: "{version >= 0x20200}"
      description: "チーム ID の文字列の位置（0 なら無し。版 0x20200 以降）"
    - name: spare3
      type: uint32
      if: "{version >= 0x20300}"
      description: "予約（0）"
    - name: code_limit_64
      type: uint64
      if: "{version >= 0x20300}"
      description: "4 GiB を超える署名の範囲（0 なら code_limit を使う。版 0x20300 以降）"
    - name: exec_seg_base
      type: uint64
      if: "{version >= 0x20400}"
      description: "実行セグメントの位置（版 0x20400 以降）"
    - name: exec_seg_limit
      type: uint64
      if: "{version >= 0x20400}"
      description: "実行セグメントのバイト数"
    - name: exec_seg_flags
      type: uint64
      if: "{version >= 0x20400}"
      description: "実行セグメントのフラグ（0x1 = メインの実行ファイル など）"
    - name: identifier
      type: asciiz
      seek: "{blob_start + ident_offset}"
      seek_restore: true
      description: "識別子（通常はバンドル ID かファイル名。例: com.apple.ls）"
    - name: team_id
      type: asciiz
      seek: "{blob_start + team_offset}"
      seek_restore: true
      if: "{version >= 0x20200 ? team_offset != 0 : 0}"
      description: "開発者のチーム ID"

  entitlements:
    - name: xml
      type: utf8
      size: remaining
      description: "エンタイトルメント（XML のプロパティリスト）"

  raw_data:
    - name: data
      type: bytes
      size: remaining
      description: "分解しないデータ"
