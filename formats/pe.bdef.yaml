# PE（Portable Executable。Windows の .exe / .dll / .sys、.NET のアセンブリ、UEFI のイメージ）
# 仕様: Microsoft "PE Format"（Microsoft Learn、2024-07 更新） https://learn.microsoft.com/en-us/windows/win32/debug/pe-format 、
#   .NET の CLI ヘッダとメタデータのルートは ECMA-335 第 6 版（2012）II.24–25 https://ecma-international.org/publications-and-standards/standards/ecma-335/
# 構造: MS-DOS ヘッダ（'MZ'）→ DOS スタブ → e_lfanew の位置の 'PE\0\0' → COFF ヘッダ → オプションヘッダ（PE32 / PE32+ を magic で switch）
#   → セクション表 → セクションの中身。データディレクトリは RVA（読み込み後のアドレス）で位置を持つため、
#   各セクションヘッダで「RVA がこのセクションに入っているか」を確かめ、入っていれば RVA − VirtualAddress + PointerToRawData へ seek して読む。
#   エクスポート・インポート・デバッグ（CodeView の PDB パス）・ベース再配置・CLR ヘッダ（.NET のメタデータのルート）を分解する。
#   証明書の表だけはファイル上の位置で持つので、ルートから seek して読む。
# 対応していないもの: オブジェクトファイル（'MZ' の無い COFF）、リソースの木構造・例外・TLS・ロード構成・遅延読み込み・バインドのディレクトリ、
#   ほかのセクションにまたがるインポート名・エクスポート名（ディレクトリと同じセクションにある前提で引く）、
#   Rich ヘッダ（DOS スタブの中の XOR された情報）、チェックサムの検証（PE 独自のアルゴリズム）、証明書（PKCS#7）の中身、
#   .NET のメタデータの表（#~ ストリーム）の中身、COFF のシンボル表と長いセクション名（'/数字'）
name: PE
endianness: little
root: pe

