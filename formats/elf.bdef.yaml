# ELF（Executable and Linkable Format。実行ファイル・共有ライブラリ・オブジェクトファイル・コアダンプ）
# 仕様: ELF Object File Format Version 4.3 DRAFT（System V gABI、Xinuos 2025） https://gabi.xinuos.com/ 、
#   GNU の拡張（PT_GNU_* / SHT_GNU_* / DT_GNU_HASH / NT_GNU_*。Linux Standard Base Core 5.0 と binutils の elf/common.h）
# 構造: e_ident（16 バイト。クラスとエンディアン）→ ELF ヘッダ → プログラムヘッダ表（e_phoff）・セクションヘッダ表（e_shoff）。
#   e_ident の ei_class で 32 / 64 ビットを switch し、ei_data から struct のエンディアンを決める。
#   各エントリは e_phoff + 番号 × e_phentsize へ seek して読む。セクション名は .shstrtab（e_shstrndx）を先読みして引く。
#   セクションの中身は種類で switch する（シンボル表・文字列表・再配置・動的セクション・ノート・圧縮セクション）。
#   シンボル名・DT_NEEDED などの名前は、sh_link のセクションヘッダの sh_offset を先読みして文字列表から引く。
# 対応していないもの: 機械語・データの中身、再配置のシンボル名と種類のラベル（アーキテクチャごとに異なる）、
#   e_flags とプロセッサ固有の値（0x70000000 以上の p_type / sh_type は ARM など一部のみ）、e_machine の主要な値以外のラベル、
#   セクションの無いファイルの PT_NOTE / PT_DYNAMIC の中身（プログラムヘッダ側は PT_INTERP だけ分解する）、
#   シンボルのバージョン（.gnu.version*）・ハッシュ表・グループ・.eh_frame の分解、コアダンプのノートの中身
name: ELF
root: elf

enums:
  ei_class:
    - value: 0
      label: ELFCLASSNONE
      description: "不正なクラス"
