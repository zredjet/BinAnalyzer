    bit_size: 32
    fields:
      - name: PF_X
        bit: 0
      - name: PF_W
        bit: 1
      - name: PF_R
        bit: 2

  sh_flags:
    bit_size: 32
    fields:
      - name: SHF_WRITE
        bit: 0
      - name: SHF_ALLOC
        bit: 1
      - name: SHF_EXECINSTR
        bit: 2
      - name: SHF_MERGE
        bit: 4
      - name: SHF_STRINGS
        bit: 5
      - name: SHF_INFO_LINK
        bit: 6
      - name: SHF_LINK_ORDER
        bit: 7
      - name: SHF_OS_NONCONFORMING
        bit: 8
      - name: SHF_GROUP
        bit: 9
      - name: SHF_TLS
        bit: 10
      - name: SHF_COMPRESSED
        bit: 11

structs:
  elf:
    - name: e_ident
      type: struct
      struct: elf_ident
      description: "ELF 識別子（先頭 16 バイト。クラス・エンディアン・OS ABI）"
    - name: body
      type: switch
      switch_on: "{ei_class}"
      cases:
        "1": elf32_body
        "2": elf64_body
      default: raw_data
      description: "ELF ヘッダ以降（ei_class で 32 / 64 ビットを振り分ける）"

  elf_ident:
    - name: magic
      type: bytes
      size: "4"
      expected: [0x7F, 0x45, 0x4C, 0x46]
      description: "マジック（7F 'ELF'）"
    - name: ei_class
      type: uint8
      enum: ei_class
      description: "クラス（アドレスと主なフィールドの幅。1 = 32 ビット、2 = 64 ビット）"
    - name: ei_data
      type: uint8
      enum: ei_data
      description: "データのエンディアン（以降のすべての多バイト値に当てはまる）"
    - name: ei_version
      type: uint8
      validate: "{ei_version == 1}"
      description: "ELF の版（EV_CURRENT = 1）"
    - name: ei_osabi
      type: uint8
      enum: ei_osabi
      description: "OS・ABI の拡張の種類"
    - name: ei_abiversion
      type: uint8
      description: "ABI の版（ei_osabi ごとの意味。通常 0）"
    - name: ei_pad
      type: bytes
      size: "7"
      padding: true
      description: "予約（0）"

  # ===== 64 ビット =====
  elf64_body:
    endianness: "{ei_data == 1 ? 'little' : 'big'}"
    fields:
      - name: header
        type: struct
        struct: elf64_header
        description: "ELF ヘッダ（e_ident の後ろの 48 バイト）"
      - name: section0_size
        type: uint64
        seek: "{e_shoff + 32}"
        seek_restore: true
        if: "{e_shnum == 0 ? e_shoff != 0 : 0}"
        description: "0 番のセクションヘッダの sh_size（先読み。e_shnum が 0 でセクションが 0xFF00 個以上あるとき、これが本当の数）"
      - name: section0_link
        type: uint32
        seek: "{e_shoff + 40}"
        seek_restore: true
        if: "{e_shstrndx == 0xFFFF ? e_shoff != 0 : 0}"
        description: "0 番のセクションヘッダの sh_link（先読み。e_shstrndx が SHN_XINDEX のとき、これが本当の .shstrtab の番号）"
      - name: section_count
        type: virtual
        value: "{e_shoff == 0 ? 0 : (e_shnum == 0 ? section0_size : e_shnum)}"
        description: "セクションの数（e_shnum。0 なら 0 番の sh_size）"
      - name: shstrtab_index
        type: virtual
        value: "{e_shstrndx == 0xFFFF ? section0_link : e_shstrndx}"
        description: "セクション名の文字列表（.shstrtab）のセクション番号（SHN_XINDEX なら 0 番の sh_link）"
      - name: shstrtab_offset
        type: uint64
        seek: "{e_shoff + shstrtab_index * e_shentsize + 24}"
        seek_restore: true
        if: "{shstrtab_index == 0 ? 0 : shstrtab_index < section_count}"
        description: ".shstrtab の sh_offset（先読み。セクション名を引くのに使う）"
      - name: program_headers
        type: struct
        struct: elf64_phdr
        repeat_count: "{e_phnum}"
        seek: "{e_phoff + _index * e_phentsize}"
        seek_restore: true
        description: "プログラムヘッダ表（e_phoff + 番号 × e_phentsize の位置の e_phnum 個。実行時のセグメント）"
      - name: section_headers
        type: struct
        struct: elf64_shdr
        repeat_count: "{section_count}"
        seek: "{e_shoff + _index * e_shentsize}"
        seek_restore: true
        description: "セクションヘッダ表（e_shoff + 番号 × e_shentsize の位置の section_count 個。リンク用のセクションとその中身）"

  elf64_header:
    - name: e_type
      type: uint16
      enum: e_type
      description: "ファイルの種類（0xFE00〜0xFEFF は OS 固有、0xFF00〜0xFFFF はプロセッサ固有）"
    - name: e_machine
      type: uint16
      enum: e_machine
      description: "対象のアーキテクチャ"
    - name: e_version
      type: uint32
      description: "ELF の版（1）"
    - name: e_entry
      type: uint64
      description: "エントリポイントの仮想アドレス（無ければ 0）"
    - name: e_phoff
      type: uint64
      description: "プログラムヘッダ表の位置（ファイル先頭から。無ければ 0）"
    - name: e_shoff
      type: uint64
      description: "セクションヘッダ表の位置（ファイル先頭から。無ければ 0）"
    - name: e_flags
      type: uint32
      description: "プロセッサ固有のフラグ（ARM の EABI 版、RISC-V の浮動小数点 ABI など）"
    - name: e_ehsize
      type: uint16
      description: "ELF ヘッダのバイト数（64 ビットは 64）"
    - name: e_phentsize
      type: uint16
      description: "プログラムヘッダ 1 個のバイト数（64 ビットは 56）"
    - name: e_phnum
      type: uint16
      description: "プログラムヘッダの数"
    - name: e_shentsize
      type: uint16
      description: "セクションヘッダ 1 個のバイト数（64 ビットは 64）"
    - name: e_shnum
      type: uint16
      description: "セクションヘッダの数（0xFF00 以上なら 0 で、本当の数は 0 番の sh_size）"
    - name: e_shstrndx
      type: uint16
      enum: special_section_index
      description: "セクション名の文字列表（.shstrtab）のセクション番号（SHN_XINDEX なら 0 番の sh_link）"

  elf64_phdr:
    - name: p_type
      type: uint32
      enum: p_type
      description: "セグメントの種類"
    - name: p_flags
      type: uint32
      flags: p_flags
      description: "セグメントのアクセス権（PF_X = 実行、PF_W = 書き込み、PF_R = 読み取り）"
    - name: p_offset
      type: uint64
      description: "セグメントのファイル上の位置"
    - name: p_vaddr
      type: uint64
      description: "セグメントを置く仮想アドレス"
    - name: p_paddr
      type: uint64
      description: "物理アドレス（物理アドレスを使う環境向け。通常は p_vaddr と同じ）"
    - name: p_filesz
      type: uint64
      description: "セグメントのファイル上のバイト数"
    - name: p_memsz
      type: uint64
      description: "セグメントのメモリ上のバイト数（p_filesz より大きい分は 0 で埋める。.bss など）"
    - name: p_align
      type: uint64
      description: "アラインメント（p_vaddr と p_offset はこの値を法として等しい）"
    - name: interpreter
      type: asciiz
      seek: "{p_offset}"
      seek_restore: true
      if: "{p_type == 3}"
      description: "プログラムインタプリタのパス（PT_INTERP のとき。例: /lib64/ld-linux-x86-64.so.2）"

  elf64_shdr:
    - name: sh_name
      type: uint32
      description: "セクション名（.shstrtab の中のオフセット）"
    - name: name
      type: asciiz
      seek: "{shstrtab_offset + sh_name}"
      seek_restore: true
      if: "{shstrtab_index == 0 ? 0 : shstrtab_index < section_count}"
      description: "セクション名（.shstrtab から引いた文字列。例: .text・.dynsym）"
    - name: sh_type
      type: uint32
      enum: sh_type
      description: "セクションの種類"
    - name: sh_flags
      type: uint64
      flags: sh_flags
      description: "セクションの属性（SHF_ALLOC = 実行時にメモリに置く、SHF_EXECINSTR = 機械語、SHF_COMPRESSED = 圧縮 など）"
    - name: sh_addr
      type: uint64
      description: "実行時の仮想アドレス（メモリに置かないセクションは 0）"
    - name: sh_offset
      type: uint64
      description: "中身のファイル上の位置"
    - name: sh_size
      type: uint64
      description: "中身のバイト数（SHT_NOBITS はファイル上に領域を持たない）"
    - name: sh_link
      type: uint32
      description: "関連するセクションの番号（シンボル表なら文字列表、再配置ならシンボル表 など）"
    - name: sh_info
      type: uint32
      description: "種類ごとの追加情報（シンボル表なら最初の非ローカルシンボルの番号、再配置なら適用先のセクション番号）"
    - name: sh_addralign
      type: uint64
      description: "アラインメント（0 と 1 は制約なし）"
    - name: sh_entsize
      type: uint64
      description: "固定長のエントリの表ならエントリ 1 個のバイト数（そうでなければ 0）"
    - name: contents
      type: switch
      switch_on: "{(sh_flags & 0x800) != 0 ? -2 : sh_type}"
      seek: "{sh_offset}"
      seek_restore: true
      if: "{sh_type == 0 ? 0 : (sh_type == 8 ? 0 : sh_size > 0)}"
      cases:
        "2": elf64_symbol_table
        "11": elf64_symbol_table
        "3": string_table
        "4": elf64_rela_table
        "9": elf64_rel_table
        "6": elf64_dynamic_table
        "7": note_list
        "-2": elf64_compressed_section
      default: section_data
      description: "セクションの中身（sh_offset から sh_size バイト。種類で振り分け、SHF_COMPRESSED は展開する）"

  elf64_symbol_table:
    - name: string_table_offset
      type: uint64
      seek: "{e_shoff + sh_link * e_shentsize + 24}"
      seek_restore: true
      description: "シンボル名の文字列表（sh_link のセクション）の sh_offset（先読み）"
    - name: symbols
      type: struct
      struct: elf64_sym
      repeat_count: "{sh_size / 24}"
      description: "シンボル（24 バイトずつ sh_size ÷ 24 個。0 番は未定義の空のシンボル）"

  elf64_sym:
    - name: st_name
      type: uint32
      description: "シンボル名（文字列表の中のオフセット。0 なら名前なし）"
    - name: name
      type: asciiz
      seek: "{string_table_offset + st_name}"
      seek_restore: true
      if: "{st_name != 0}"
      description: "シンボル名（文字列表から引いた文字列。C++ はマングルされた名前）"
    - name: st_info
      type: uint8
      description: "結合方法（上位 4 ビット）と種類（下位 4 ビット）"
    - name: bind
      type: virtual
      value: "{st_info >> 4}"
      enum: sym_bind
      description: "結合方法（st_info の上位 4 ビット）"
    - name: symbol_type
      type: virtual
      value: "{st_info & 0x0F}"
      enum: sym_type
      description: "シンボルの種類（st_info の下位 4 ビット）"
    - name: st_other
      type: uint8
      description: "可視性（下位 2 ビット）"
    - name: visibility
      type: virtual
      value: "{st_other & 3}"
      enum: sym_visibility
      description: "可視性（st_other の下位 2 ビット）"
    - name: st_shndx
      type: uint16
      enum: special_section_index
      description: "定義されているセクションの番号（SHN_UNDEF = 未定義、SHN_ABS = 絶対値）"
    - name: st_value
      type: uint64
      description: "値（実行ファイル・共有オブジェクトでは仮想アドレス、.o ではセクション内のオフセット）"
    - name: st_size
      type: uint64
      description: "大きさ（関数・データのバイト数。不明なら 0）"

  elf64_rela_table:
    - name: relocations
      type: struct
      struct: elf64_rela
      repeat_count: "{sh_size / 24}"
      description: "加数付きの再配置（24 バイトずつ）"

  elf64_rela:
    - name: r_offset
      type: uint64
      description: "再配置を当てる位置（.o ではセクション内のオフセット、それ以外は仮想アドレス）"
    - name: r_info
      type: uint64
      description: "シンボルの番号（上位 32 ビット）と再配置の種類（下位 32 ビット）"
    - name: symbol_index
      type: virtual
      value: "{r_info >> 32}"
      description: "再配置が参照するシンボルの番号（sh_link のシンボル表の中）"
    - name: relocation_type
      type: virtual
      value: "{r_info & 0xFFFFFFFF}"
      description: "再配置の種類（アーキテクチャごとの番号。例: x86-64 の R_X86_64_RELATIVE = 8）"
    - name: r_addend
      type: int64
      description: "加数（計算に加える定数）"

  elf64_rel_table:
    - name: relocations
      type: struct
      struct: elf64_rel
      repeat_count: "{sh_size / 16}"
      description: "加数なしの再配置（16 バイトずつ）"

  elf64_rel:
    - name: r_offset
      type: uint64
      description: "再配置を当てる位置"
    - name: r_info
      type: uint64
      description: "シンボルの番号（上位 32 ビット）と再配置の種類（下位 32 ビット）"
    - name: symbol_index
      type: virtual
      value: "{r_info >> 32}"
      description: "再配置が参照するシンボルの番号"
    - name: relocation_type
      type: virtual
      value: "{r_info & 0xFFFFFFFF}"
      description: "再配置の種類（アーキテクチャごとの番号）"

  elf64_dynamic_table:
    - name: string_table_offset
      type: uint64
      seek: "{e_shoff + sh_link * e_shentsize + 24}"
      seek_restore: true
      description: "動的文字列表（sh_link のセクション。.dynstr）の sh_offset（先読み）"
    - name: entries
      type: struct
      struct: elf64_dyn
      repeat_count: "{sh_size / 16}"
      description: "動的リンクの情報（16 バイトずつ。DT_NULL の後ろは詰め物）"

  elf64_dyn:
    - name: d_tag
      type: int64
      enum: d_tag
      description: "エントリの種類"
    - name: d_val
      type: uint64
      description: "値またはアドレス（種類ごとの意味）"
    - name: string_value
      type: asciiz
      seek: "{string_table_offset + d_val}"
      seek_restore: true
      if: "{d_tag == 1 or d_tag == 14 or d_tag == 15 or d_tag == 29}"
      description: "名前（DT_NEEDED・DT_SONAME・DT_RPATH・DT_RUNPATH のとき、.dynstr から引いた文字列）"

  elf64_compressed_section:
    - name: ch_type
      type: uint32
      enum: compression_type
      description: "圧縮方式"
    - name: ch_reserved
      type: uint32
      description: "予約（0）"
    - name: ch_size
      type: uint64
      description: "展開後のバイト数"
    - name: ch_addralign
      type: uint64
      description: "展開後のデータのアラインメント"
    - name: data
      type: switch
      switch_on: "{ch_type}"
      size: "{sh_size - 24}"
      cases:
        "1": zlib_data
        "2": zstd_data
      default: raw_data
      description: "圧縮データ（zlib / Zstandard は展開して表示）"

  # ===== 32 ビット =====
  elf32_body:
    endianness: "{ei_data == 1 ? 'little' : 'big'}"
    fields:
      - name: header
        type: struct
        struct: elf32_header
        description: "ELF ヘッダ（e_ident の後ろの 36 バイト）"
      - name: section0_size
        type: uint32
        seek: "{e_shoff + 20}"
        seek_restore: true
        if: "{e_shnum == 0 ? e_shoff != 0 : 0}"
        description: "0 番のセクションヘッダの sh_size（先読み。e_shnum が 0 でセクションが 0xFF00 個以上あるとき、これが本当の数）"
      - name: section0_link
        type: uint32
        seek: "{e_shoff + 24}"
        seek_restore: true
        if: "{e_shstrndx == 0xFFFF ? e_shoff != 0 : 0}"
        description: "0 番のセクションヘッダの sh_link（先読み。e_shstrndx が SHN_XINDEX のとき、これが本当の .shstrtab の番号）"
      - name: section_count
        type: virtual
        value: "{e_shoff == 0 ? 0 : (e_shnum == 0 ? section0_size : e_shnum)}"
        description: "セクションの数（e_shnum。0 なら 0 番の sh_size）"
      - name: shstrtab_index
        type: virtual
        value: "{e_shstrndx == 0xFFFF ? section0_link : e_shstrndx}"
        description: "セクション名の文字列表（.shstrtab）のセクション番号（SHN_XINDEX なら 0 番の sh_link）"
      - name: shstrtab_offset
        type: uint32
        seek: "{e_shoff + shstrtab_index * e_shentsize + 16}"
        seek_restore: true
        if: "{shstrtab_index == 0 ? 0 : shstrtab_index < section_count}"
        description: ".shstrtab の sh_offset（先読み。セクション名を引くのに使う）"
      - name: program_headers
        type: struct
        struct: elf32_phdr
        repeat_count: "{e_phnum}"
        seek: "{e_phoff + _index * e_phentsize}"
        seek_restore: true
        description: "プログラムヘッダ表（e_phoff + 番号 × e_phentsize の位置の e_phnum 個。実行時のセグメント）"
      - name: section_headers
        type: struct
        struct: elf32_shdr
        repeat_count: "{section_count}"
        seek: "{e_shoff + _index * e_shentsize}"
        seek_restore: true
        description: "セクションヘッダ表（e_shoff + 番号 × e_shentsize の位置の section_count 個。リンク用のセクションとその中身）"

  elf32_header:
    - name: e_type
      type: uint16
      enum: e_type
      description: "ファイルの種類（0xFE00〜0xFEFF は OS 固有、0xFF00〜0xFFFF はプロセッサ固有）"
    - name: e_machine
      type: uint16
      enum: e_machine
      description: "対象のアーキテクチャ"
    - name: e_version
      type: uint32
      description: "ELF の版（1）"
    - name: e_entry
      type: uint32
      description: "エントリポイントの仮想アドレス（無ければ 0）"
    - name: e_phoff
      type: uint32
      description: "プログラムヘッダ表の位置（ファイル先頭から。無ければ 0）"
    - name: e_shoff
      type: uint32
      description: "セクションヘッダ表の位置（ファイル先頭から。無ければ 0）"
    - name: e_flags
      type: uint32
      description: "プロセッサ固有のフラグ（ARM の EABI 版、MIPS の ABI など）"
    - name: e_ehsize
      type: uint16
      description: "ELF ヘッダのバイト数（32 ビットは 52）"
    - name: e_phentsize
      type: uint16
      description: "プログラムヘッダ 1 個のバイト数（32 ビットは 32）"
    - name: e_phnum
      type: uint16
      description: "プログラムヘッダの数"
    - name: e_shentsize
      type: uint16
      description: "セクションヘッダ 1 個のバイト数（32 ビットは 40）"
    - name: e_shnum
      type: uint16
      description: "セクションヘッダの数（0xFF00 以上なら 0 で、本当の数は 0 番の sh_size）"
    - name: e_shstrndx
      type: uint16
      enum: special_section_index
      description: "セクション名の文字列表（.shstrtab）のセクション番号（SHN_XINDEX なら 0 番の sh_link）"

  elf32_phdr:
    - name: p_type
      type: uint32
      enum: p_type
      description: "セグメントの種類"
    - name: p_offset
      type: uint32
      description: "セグメントのファイル上の位置"
    - name: p_vaddr
      type: uint32
      description: "セグメントを置く仮想アドレス"
    - name: p_paddr
      type: uint32
      description: "物理アドレス（通常は p_vaddr と同じ）"
    - name: p_filesz
      type: uint32
      description: "セグメントのファイル上のバイト数"
    - name: p_memsz
      type: uint32
      description: "セグメントのメモリ上のバイト数（p_filesz より大きい分は 0 で埋める）"
    - name: p_flags
      type: uint32
      flags: p_flags
      description: "セグメントのアクセス権（32 ビットでは p_memsz の後ろ。PF_X / PF_W / PF_R）"
    - name: p_align
      type: uint32
      description: "アラインメント（p_vaddr と p_offset はこの値を法として等しい）"
    - name: interpreter
      type: asciiz
      seek: "{p_offset}"
      seek_restore: true
      if: "{p_type == 3}"
      description: "プログラムインタプリタのパス（PT_INTERP のとき。例: /lib/ld-linux.so.2）"

  elf32_shdr:
    - name: sh_name
      type: uint32
      description: "セクション名（.shstrtab の中のオフセット）"
    - name: name
      type: asciiz
      seek: "{shstrtab_offset + sh_name}"
      seek_restore: true
      if: "{shstrtab_index == 0 ? 0 : shstrtab_index < section_count}"
      description: "セクション名（.shstrtab から引いた文字列）"
    - name: sh_type
      type: uint32
      enum: sh_type
      description: "セクションの種類"
    - name: sh_flags
      type: uint32
      flags: sh_flags
      description: "セクションの属性（SHF_ALLOC / SHF_EXECINSTR / SHF_COMPRESSED など）"
    - name: sh_addr
      type: uint32
      description: "実行時の仮想アドレス（メモリに置かないセクションは 0）"
    - name: sh_offset
      type: uint32
      description: "中身のファイル上の位置"
    - name: sh_size
      type: uint32
      description: "中身のバイト数（SHT_NOBITS はファイル上に領域を持たない）"
    - name: sh_link
      type: uint32
      description: "関連するセクションの番号（シンボル表なら文字列表、再配置ならシンボル表 など）"
    - name: sh_info
      type: uint32
      description: "種類ごとの追加情報（シンボル表なら最初の非ローカルシンボルの番号、再配置なら適用先のセクション番号）"
    - name: sh_addralign
      type: uint32
      description: "アラインメント（0 と 1 は制約なし）"
    - name: sh_entsize
      type: uint32
      description: "固定長のエントリの表ならエントリ 1 個のバイト数（そうでなければ 0）"
    - name: contents
      type: switch
      switch_on: "{(sh_flags & 0x800) != 0 ? -2 : sh_type}"
      seek: "{sh_offset}"
      seek_restore: true
      if: "{sh_type == 0 ? 0 : (sh_type == 8 ? 0 : sh_size > 0)}"
      cases:
        "2": elf32_symbol_table
        "11": elf32_symbol_table
        "3": string_table
        "4": elf32_rela_table
        "9": elf32_rel_table
        "6": elf32_dynamic_table
        "7": note_list
        "-2": elf32_compressed_section
      default: section_data
      description: "セクションの中身（sh_offset から sh_size バイト。種類で振り分け、SHF_COMPRESSED は展開する）"

  elf32_symbol_table:
    - name: string_table_offset
      type: uint32
      seek: "{e_shoff + sh_link * e_shentsize + 16}"
      seek_restore: true
      description: "シンボル名の文字列表（sh_link のセクション）の sh_offset（先読み）"
    - name: symbols
      type: struct
      struct: elf32_sym
      repeat_count: "{sh_size / 16}"
      description: "シンボル（16 バイトずつ sh_size ÷ 16 個。0 番は未定義の空のシンボル）"

  elf32_sym:
    - name: st_name
      type: uint32
      description: "シンボル名（文字列表の中のオフセット。0 なら名前なし）"
    - name: name
      type: asciiz
      seek: "{string_table_offset + st_name}"
      seek_restore: true
      if: "{st_name != 0}"
      description: "シンボル名（文字列表から引いた文字列）"
    - name: st_value
      type: uint32
      description: "値（実行ファイル・共有オブジェクトでは仮想アドレス、.o ではセクション内のオフセット。32 ビットでは st_info より前）"
    - name: st_size
      type: uint32
      description: "大きさ（関数・データのバイト数。不明なら 0）"
    - name: st_info
      type: uint8
      description: "結合方法（上位 4 ビット）と種類（下位 4 ビット）"
    - name: bind
      type: virtual
      value: "{st_info >> 4}"
      enum: sym_bind
      description: "結合方法（st_info の上位 4 ビット）"
    - name: symbol_type
      type: virtual
      value: "{st_info & 0x0F}"
      enum: sym_type
      description: "シンボルの種類（st_info の下位 4 ビット）"
    - name: st_other
      type: uint8
      description: "可視性（下位 2 ビット）"
    - name: visibility
      type: virtual
      value: "{st_other & 3}"
      enum: sym_visibility
      description: "可視性（st_other の下位 2 ビット）"
    - name: st_shndx
      type: uint16
      enum: special_section_index
      description: "定義されているセクションの番号（SHN_UNDEF = 未定義、SHN_ABS = 絶対値）"

  elf32_rela_table:
    - name: relocations
      type: struct
      struct: elf32_rela
      repeat_count: "{sh_size / 12}"
      description: "加数付きの再配置（12 バイトずつ）"

  elf32_rela:
    - name: r_offset
      type: uint32
      description: "再配置を当てる位置"
    - name: r_info
      type: uint32
      description: "シンボルの番号（上位 24 ビット）と再配置の種類（下位 8 ビット）"
    - name: symbol_index
      type: virtual
      value: "{r_info >> 8}"
      description: "再配置が参照するシンボルの番号"
    - name: relocation_type
      type: virtual
      value: "{r_info & 0xFF}"
      description: "再配置の種類（アーキテクチャごとの番号）"
    - name: r_addend
      type: int32
      description: "加数（計算に加える定数）"

  elf32_rel_table:
    - name: relocations
      type: struct
      struct: elf32_rel
      repeat_count: "{sh_size / 8}"
      description: "加数なしの再配置（8 バイトずつ）"

  elf32_rel:
    - name: r_offset
      type: uint32
      description: "再配置を当てる位置"
    - name: r_info
      type: uint32
      description: "シンボルの番号（上位 24 ビット）と再配置の種類（下位 8 ビット）"
    - name: symbol_index
      type: virtual
      value: "{r_info >> 8}"
      description: "再配置が参照するシンボルの番号"
    - name: relocation_type
      type: virtual
      value: "{r_info & 0xFF}"
      description: "再配置の種類（アーキテクチャごとの番号。例: ARM の R_ARM_RELATIVE = 23）"

  elf32_dynamic_table:
    - name: string_table_offset
      type: uint32
      seek: "{e_shoff + sh_link * e_shentsize + 16}"
      seek_restore: true
      description: "動的文字列表（sh_link のセクション。.dynstr）の sh_offset（先読み）"
    - name: entries
      type: struct
      struct: elf32_dyn
      repeat_count: "{sh_size / 8}"
      description: "動的リンクの情報（8 バイトずつ。DT_NULL の後ろは詰め物）"

  elf32_dyn:
    - name: d_tag
      type: int32
      enum: d_tag
      description: "エントリの種類"
    - name: d_val
      type: uint32
      description: "値またはアドレス（種類ごとの意味）"
    - name: string_value
      type: asciiz
      seek: "{string_table_offset + d_val}"
      seek_restore: true
      if: "{d_tag == 1 or d_tag == 14 or d_tag == 15 or d_tag == 29}"
      description: "名前（DT_NEEDED・DT_SONAME・DT_RPATH・DT_RUNPATH のとき、.dynstr から引いた文字列）"

  elf32_compressed_section:
    - name: ch_type
      type: uint32
      enum: compression_type
      description: "圧縮方式"
    - name: ch_size
      type: uint32
      description: "展開後のバイト数"
    - name: ch_addralign
      type: uint32
      description: "展開後のデータのアラインメント"
    - name: data
      type: switch
      switch_on: "{ch_type}"
      size: "{sh_size - 12}"
      cases:
        "1": zlib_data
        "2": zstd_data
      default: raw_data
      description: "圧縮データ（zlib / Zstandard は展開して表示）"

  # ===== 32 / 64 ビット共通 =====
  string_table:
    - name: strings
      type: asciiz
      size: "{sh_size}"
      repeat: eof
      description: "NUL 終端の文字列の並び（先頭は空文字列。ほかのセクションからオフセットで参照される）"

  note_list:
    - name: notes
      type: struct
      struct: note
      size: "{sh_size}"
      repeat: eof
      description: "ノート（名前 + 種類 + 記述子）の並び"

  note:
    - name: note_align
      type: virtual
      value: "{sh_addralign == 8 ? 8 : 4}"
      description: "名前と記述子のアラインメント（4 バイト。sh_addralign が 8 のセクションは 8 バイト）"
    - name: n_namesz
      type: uint32
      description: "名前のバイト数（NUL を含む）"
    - name: n_descsz
      type: uint32
      description: "記述子のバイト数"
    - name: n_type
      type: uint32
      description: "ノートの種類（名前ごとの意味）"
    - name: name
      type: ascii
      size: "{n_namesz}"
      description: "作成者の名前（'GNU'・'FreeBSD'・'Android'・'CORE' など。NUL を含む）"
    - name: gnu_type
      type: virtual
      value: "{n_type}"
      enum: gnu_note_type
      if: "{trim(name) == 'GNU'}"
      description: "GNU のノートの種類（名前が 'GNU' のとき）"
    - name: name_padding
      type: bytes
      size: "{(note_align - n_namesz % note_align) % note_align}"
      padding: true
      description: "名前の後ろの詰め物（4 バイト境界。sh_addralign が 8 のセクションは 8 バイト境界）"
    - name: desc
      type: bytes
      size: "{n_descsz}"
      description: "記述子（ビルド ID のハッシュ、ABI タグの OS と版、プロパティの並び など）"
    - name: desc_padding
      type: bytes
      size: "{(note_align - n_descsz % note_align) % note_align}"
      if: "{remaining > 0}"
      padding: true
      description: "記述子の後ろの詰め物"

  zlib_data:
    - name: content
      type: zlib
      size: remaining
      description: "zlib で圧縮されたデータ（展開して表示。デバッグ情報など）"

  zstd_data:
    - name: content
      type: zstd
      size: remaining
      description: "Zstandard で圧縮されたデータ（展開して表示）"

  section_data:
    - name: data
      type: bytes
      size: "{sh_size}"
      description: "分解しないセクションの中身（機械語・データなど。sh_size バイト）"

  raw_data:
    - name: data
      type: bytes
      size: remaining
      description: "分解しないデータ"
