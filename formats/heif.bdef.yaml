name: HEIF
endianness: big
root: heif_file

structs:
  heif_file:
    - name: boxes
      type: struct
      struct: iso_box
      repeat: eof

  iso_box:
    - name: box_size
      type: uint32
    - name: box_type
      type: ascii
      size: "4"
    - name: extended_size
      type: uint64
      if: "{box_size == 1}"
    - name: box_data
      type: switch
      size: "{box_size == 0 ? remaining : (box_size == 1 ? extended_size - 16 : box_size - 8)}"
      switch_on: "{box_type}"
      cases:
        "'ftyp'": ftyp_box
        "'meta'": meta_box
        "'pitm'": pitm_box
        "'iloc'": iloc_box
        "'iinf'": iinf_box
        "'infe'": infe_box
        "'iprp'": container_box
        "'ipco'": container_box
        "'ipma'": raw_data
        "'idat'": raw_data
        "'iref'": raw_data
        "'hdlr'": hdlr_box
        "'dinf'": container_box
        "'dref'": dref_box
        "'mdat'": raw_data
        "'free'": raw_data
        "'skip'": raw_data
        "'moov'": container_box
        "'trak'": container_box
        "'mdia'": container_box
      default: raw_data

  container_box:
    - name: children
      type: struct
      struct: iso_box
      repeat: eof

  ftyp_box:
    - name: major_brand
      type: ascii
      size: "4"
      description: "メジャーブランド（例: heic, heix, mif1）"
    - name: minor_version
      type: uint32
      description: "マイナーバージョン"
    - name: compatible_brands
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      description: "互換ブランドリスト（各4バイトのASCII）"

  meta_box:
    - name: version
      type: uint8
      description: "FullBox バージョン"
    - name: flags
      type: bytes
      size: "3"
      description: "FullBox フラグ"
    - name: children
      type: struct
      struct: iso_box
      repeat: eof

  hdlr_box:
    - name: version
      type: uint8
    - name: flags
      type: bytes
      size: "3"
    - name: pre_defined
      type: uint32
    - name: handler_type
      type: ascii
      size: "4"
      description: "ハンドラタイプ（HEIFでは 'pict'）"
    - name: reserved
      type: bytes
      size: "12"
    - name: name
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      description: "ハンドラ名（UTF-8 文字列）"

  pitm_box:
    - name: version
      type: uint8
      description: "FullBox バージョン"
    - name: flags
      type: bytes
      size: "3"
    - name: item_id
      type: uint16
      if: "{version == 0}"
      description: "プライマリアイテムID（version 0）"
    - name: item_id_v1
      type: uint32
      if: "{version != 0}"
      description: "プライマリアイテムID（version 1+）"

  iloc_box:
    - name: version
      type: uint8
      description: "FullBox バージョン"
    - name: flags
      type: bytes
      size: "3"
    - name: size_info
      type: uint16
      description: "offset_size(4bit) + length_size(4bit) + base_offset_size(4bit) + reserved/index_size(4bit)"
    - name: item_count
      type: uint16
      if: "{version < 2}"
      description: "アイテム数（version 0/1）"
    - name: item_count_v2
      type: uint32
      if: "{version >= 2}"
      description: "アイテム数（version 2）"
    - name: items_data
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      description: "アイテムロケーション配列（可変長）"

  iinf_box:
    - name: version
      type: uint8
      description: "FullBox バージョン"
    - name: flags
      type: bytes
      size: "3"
    - name: entry_count
      type: uint16
      if: "{version == 0}"
      description: "エントリ数（version 0）"
    - name: entry_count_v1
      type: uint32
      if: "{version != 0}"
      description: "エントリ数（version 1+）"
    - name: entries
      type: struct
      struct: iso_box
      repeat: eof
      if: "{remaining > 0}"
      description: "infe ボックスの配列"

  infe_box:
    - name: version
      type: uint8
      description: "FullBox バージョン"
    - name: flags
      type: bytes
      size: "3"
    - name: item_id
      type: uint16
      if: "{version < 3}"
      description: "アイテムID（version 0-2）"
    - name: item_id_v3
      type: uint32
      if: "{version >= 3}"
      description: "アイテムID（version 3+）"
    - name: item_protection_index
      type: uint16
      description: "保護インデックス"
    - name: item_type
      type: ascii
      size: "4"
      if: "{version >= 2}"
      description: "アイテムタイプ（例: 'hvc1', 'grid'）"
    - name: item_name
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      description: "アイテム名（null終端文字列）"

  dref_box:
    - name: version
      type: uint8
    - name: flags
      type: bytes
      size: "3"
    - name: entry_count
      type: uint32
    - name: entries
      type: bytes
      size: remaining
      if: "{remaining > 0}"
      description: "データ参照エントリ"

  raw_data:
    - name: data
      type: bytes
      size: remaining
