# Apache Parquet（列指向のデータファイル）
# 仕様: Apache Parquet Format 2.12.0（parquet.thrift、2025） https://github.com/apache/parquet-format 、
#   Apache Thrift Compact Protocol https://github.com/apache/thrift/blob/master/doc/specs/thrift-compact-protocol.md 。pyarrow 22.0（parquet-cpp-arrow）が出力したファイルで照合した
# 構造: 'PAR1' → 列チャンク（ページの並び）→ フッタ（Thrift Compact Protocol の FileMetaData）→ フッタのバイト数（4 バイト）→ 'PAR1'。
#   Thrift の構造体はフィールド（ヘッダ 1 バイト = 前のフィールドとの番号の差 4 ビット + 型 4 ビット、[番号] + 値）の並びで、型 0（STOP）で終わる。
#   構造体の種類（FileMetaData・SchemaElement・RowGroup・ColumnChunk・ColumnMetaData など）を親のフィールドの番号から決め、フィールドの名前と値の列挙型を付ける
# 対応していないもの: ページのデータ（圧縮・符号化された値。バイト列）、2 つ目以降のページのヘッダ（各列の最初のデータページと辞書ページだけ読む）、
#   暗号化されたフッタ（'PARE'）、オフセットインデックス・列インデックス・ブルームフィルタの中身、INT96 などの統計の値の型に応じた表示（バイト列）、
#   Thrift の bool のリストの値の表示（1 バイトの整数）、表に無いフィールドの名前（番号のみ）
name: Parquet
endianness: little
root: parquet

