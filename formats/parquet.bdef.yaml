structs:
  parquet:
    - name: file_size
      type: virtual
      value: "{remaining}"
      description: "ファイルのバイト数"
    - name: magic
      type: ascii
      size: "4"
      validate: "{magic == 'PAR1'}"
      description: "先頭のマジック（'PAR1'）"
    - name: footer_length
      type: uint32
      seek: "{file_size - 8}"
      seek_restore: true
      description: "フッタ（FileMetaData）のバイト数（末尾から 8 バイト目）"
    - name: footer_magic
      type: ascii
      size: "4"
      seek: "{file_size - 4}"
      seek_restore: true
      validate: "{footer_magic == 'PAR1'}"
      description: "末尾のマジック（'PAR1'。暗号化されたフッタは 'PARE'）"
    - name: column_chunks
      type: bytes
      size: "{file_size - 12 - footer_length}"
      description: "列チャンクの並び（各列のページ。フッタの ColumnMetaData から位置を引く）"
    - name: next_kind
      type: virtual
      value: "{1}"
      description: "次に読む Thrift の構造体の種類（作業用。フッタは FileMetaData）"
      padding: true
      enum: struct_kind
    - name: footer
      type: struct
      struct: thrift_struct
      size: "{footer_length}"
      description: "フッタ（FileMetaData）"
    - name: trailer
      type: bytes
      size: "8"
      description: "フッタのバイト数と末尾のマジック"

  # Thrift の構造体。エンディアンを書いた形にして独自の変数のスコープを持たせ、入れ子の構造体の値が親の値を上書きしないようにする
  thrift_struct:
    endianness: little
    fields:
      - name: struct_kind
        type: virtual
        value: "{next_kind}"
        enum: struct_kind
        description: "構造体の種類（親のフィールドの番号で決まる）"
      - name: last_field_id
        type: virtual
        value: "{0}"
        description: "直前のフィールドの番号（作業用。番号の差の基準）"
        padding: true
      - name: fields
        type: struct
        struct: thrift_field
        repeat_until: "{field_type == 0}"
        description: "フィールドの並び（STOP で終わる）"

  thrift_field:
    - name: field_header
      type: bitfield
      size: "1"
      description: "フィールドのヘッダ"
      fields:
        - name: id_delta
          bits: "7:4"
          description: "直前のフィールドとの番号の差（0 なら番号が後ろに続く）"
        - name: field_type
          bits: "3:0"
          enum: thrift_type
          description: "値の型"
    - name: explicit_id
      type: uleb128
      if: "{id_delta == 0 and field_type != 0}"
      description: "フィールドの番号（ジグザグ符号化。番号の差が 15 を超えるとき）"
    - name: field_id
      type: virtual
      value: "{field_type == 0 ? 0 : (id_delta != 0 ? last_field_id + id_delta : ((explicit_id >> 1) ^ (0 - (explicit_id & 1))))}"
      description: "フィールドの番号"
    - name: own_kind
      type: virtual
      value: "{struct_kind}"
      description: "このフィールドを持つ構造体の種類（作業用）"
      padding: true
    - name: field
      type: virtual
      value: "{field_id}"
      enum: filemetadata_field
      if: "{field_type != 0 and own_kind == 1}"
      description: "フィールドの名前（FileMetaData）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: schemaelement_field
      if: "{field_type != 0 and own_kind == 2}"
      description: "フィールドの名前（SchemaElement）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: rowgroup_field
      if: "{field_type != 0 and own_kind == 3}"
      description: "フィールドの名前（RowGroup）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: columnchunk_field
      if: "{field_type != 0 and own_kind == 4}"
      description: "フィールドの名前（ColumnChunk）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: columnmetadata_field
      if: "{field_type != 0 and own_kind == 5}"
      description: "フィールドの名前（ColumnMetaData）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: statistics_field
      if: "{field_type != 0 and own_kind == 6}"
      description: "フィールドの名前（Statistics）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: keyvalue_field
      if: "{field_type != 0 and own_kind == 7}"
      description: "フィールドの名前（KeyValue）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: pageheader_field
      if: "{field_type != 0 and own_kind == 8}"
      description: "フィールドの名前（PageHeader）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: datapageheader_field
      if: "{field_type != 0 and own_kind == 9}"
      description: "フィールドの名前（DataPageHeader）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: dictionarypageheader_field
      if: "{field_type != 0 and own_kind == 10}"
      description: "フィールドの名前（DictionaryPageHeader）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: datapageheaderv2_field
      if: "{field_type != 0 and own_kind == 11}"
      description: "フィールドの名前（DataPageHeaderV2）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: sortingcolumn_field
      if: "{field_type != 0 and own_kind == 13}"
      description: "フィールドの名前（SortingColumn）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: pageencodingstats_field
      if: "{field_type != 0 and own_kind == 14}"
      description: "フィールドの名前（PageEncodingStats）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: columnorder_field
      if: "{field_type != 0 and own_kind == 15}"
      description: "フィールドの名前（ColumnOrder）"
    - name: field
      type: virtual
      value: "{field_id}"
      enum: logicaltype_field
      if: "{field_type != 0 and own_kind == 16}"
      description: "フィールドの名前（LogicalType）"
    - name: next_kind
      type: virtual
      value: "{own_kind == 1 and field_id == 2 ? 2 : own_kind == 1 and field_id == 4 ? 3 : own_kind == 1 and field_id == 5 ? 7 : own_kind == 1 and field_id == 7 ? 15 : own_kind == 2 and field_id == 10 ? 16 : own_kind == 3 and field_id == 1 ? 4 : own_kind == 3 and field_id == 4 ? 13 : own_kind == 4 and field_id == 3 ? 5 : own_kind == 5 and field_id == 8 ? 7 : own_kind == 5 and field_id == 12 ? 6 : own_kind == 5 and field_id == 13 ? 14 : own_kind == 8 and field_id == 5 ? 9 : own_kind == 8 and field_id == 7 ? 10 : own_kind == 8 and field_id == 8 ? 11 : own_kind == 9 and field_id == 5 ? 6 : own_kind == 11 and field_id == 8 ? 6 : 0}"
      enum: struct_kind
      if: "{field_type == 9 or field_type == 10 or field_type == 12}"
      description: "値の構造体の種類（作業用）"
      padding: true
    - name: value
      type: switch
      switch_on: "{field_type}"
      if: "{field_type != 0}"
      cases:
        "1": thrift_bool_true
        "2": thrift_bool_false
        "3": thrift_i8
        "4": thrift_varint
        "5": thrift_varint
        "6": thrift_varint
        "7": thrift_double
        "8": thrift_binary
        "9": thrift_list
        "10": thrift_list
        "11": thrift_map
        "12": thrift_struct
        "13": thrift_uuid
      default: thrift_unknown
      description: "値"
    - name: next_kind
      type: virtual
      value: "{8}"
      enum: struct_kind
      if: "{own_kind == 5 and (field_id == 9 or field_id == 11) and field_type == 6}"
      description: "ページヘッダの構造体の種類（作業用）"
      padding: true
    - name: page_header
      type: struct
      struct: thrift_struct
      seek: "{number}"
      seek_restore: true
      if: "{own_kind == 5 and (field_id == 9 or field_id == 11) and field_type == 6}"
      description: "この位置にあるページのヘッダ（PageHeader）"
    - name: last_field_id
      type: virtual
      value: "{field_id}"
      description: "次のフィールドの番号の基準（作業用。入れ子の値で上書きされた値を戻す）"
      padding: true
    - name: struct_kind
      type: virtual
      value: "{own_kind}"
      description: "この構造体の種類（作業用。入れ子の値で上書きされた値を戻す）"
      padding: true

  thrift_bool_true:
    - name: boolean
      type: virtual
      value: "{1}"
      description: "真偽値（真）"

  thrift_bool_false:
    - name: boolean
      type: virtual
      value: "{0}"
      description: "真偽値（偽）"

  thrift_i8:
    - name: number
      type: int8
      description: "8 ビット整数"

  thrift_varint:
    - name: zigzag
      type: uleb128
      description: "ジグザグ符号化した可変長整数"
    - name: number
      type: virtual
      value: "{(zigzag >> 1) ^ (0 - (zigzag & 1))}"
      description: "整数"
    - name: parquet_type
      type: virtual
      value: "{number}"
      enum: parquet_type
      if: "{(own_kind == 2 and field_id == 1) or (own_kind == 5 and field_id == 1)}"
      description: "物理型"
    - name: repetition
      type: virtual
      value: "{number}"
      enum: repetition_type
      if: "{(own_kind == 2 and field_id == 3)}"
      description: "繰り返しの種類"
    - name: converted
      type: virtual
      value: "{number}"
      enum: converted_type
      if: "{(own_kind == 2 and field_id == 6)}"
      description: "変換型"
    - name: encoding
      type: virtual
      value: "{number}"
      enum: encoding
      if: "{(own_kind == 5 and field_id == 2) or (own_kind == 9 and field_id == 2) or (own_kind == 9 and field_id == 3) or (own_kind == 9 and field_id == 4) or (own_kind == 10 and field_id == 2) or (own_kind == 11 and field_id == 4) or (own_kind == 14 and field_id == 2)}"
      description: "符号化"
    - name: codec
      type: virtual
      value: "{number}"
      enum: compression_codec
      if: "{(own_kind == 5 and field_id == 4)}"
      description: "圧縮方式"
    - name: page_type
      type: virtual
      value: "{number}"
      enum: page_type
      if: "{(own_kind == 8 and field_id == 1) or (own_kind == 14 and field_id == 1)}"
      description: "ページの種類"

  thrift_double:
    - name: number
      type: float64
      description: "倍精度の浮動小数点数"

  thrift_binary:
    - name: length
      type: uleb128
      description: "バイト数"
    - name: text
      type: utf8
      size: "{length}"
      if: "{(own_kind == 1 and field_id == 6) or (own_kind == 2 and field_id == 4) or (own_kind == 4 and field_id == 1) or (own_kind == 5 and field_id == 3) or (own_kind == 7 and field_id == 1) or (own_kind == 7 and field_id == 2)}"
      description: "文字列（UTF-8）"
    - name: data
      type: bytes
      size: "{length}"
      if: "{not ((own_kind == 1 and field_id == 6) or (own_kind == 2 and field_id == 4) or (own_kind == 4 and field_id == 1) or (own_kind == 5 and field_id == 3) or (own_kind == 7 and field_id == 1) or (own_kind == 7 and field_id == 2))}"
      description: "バイト列（統計の最小値・最大値などは列の物理型の表現）"

  thrift_uuid:
    - name: uuid
      type: bytes
      size: "16"
      description: "UUID（16 バイト）"

  thrift_list:
    - name: list_header
      type: bitfield
      size: "1"
      description: "リストのヘッダ"
      fields:
        - name: short_count
          bits: "7:4"
          description: "要素数（15 なら要素数が後ろに続く）"
        - name: element_type
          bits: "3:0"
          enum: thrift_type
          description: "要素の型"
    - name: long_count
      type: uleb128
      if: "{short_count == 15}"
      description: "要素数（15 以上のとき）"
    - name: count
      type: virtual
      value: "{short_count == 15 ? long_count : short_count}"
      description: "要素数"
    - name: elements
      type: struct
      struct: thrift_element
      repeat_count: "{count <= remaining ? count : remaining}"
      description: "要素の並び（壊れた要素数で止まらないよう、残りのバイト数を上限にする。要素は 1 バイト以上）"

  thrift_element:
    - name: item
      type: switch
      switch_on: "{element_type}"
      cases:
        "1": thrift_i8
        "2": thrift_i8
        "3": thrift_i8
        "4": thrift_varint
        "5": thrift_varint
        "6": thrift_varint
        "7": thrift_double
        "8": thrift_binary
        "9": thrift_list
        "10": thrift_list
        "11": thrift_map
        "12": thrift_struct
        "13": thrift_uuid
      default: thrift_unknown
      description: "要素（真偽値の要素は 1 バイト）"

  thrift_map:
    - name: count
      type: uleb128
      description: "エントリ数"
    - name: kv_types
      type: bitfield
      size: "1"
      if: "{count > 0}"
      description: "キーと値の型"
      fields:
        - name: key_type
          bits: "7:4"
          enum: thrift_type
          description: "キーの型"
        - name: value_type
          bits: "3:0"
          enum: thrift_type
          description: "値の型"
    - name: entries
      type: struct
      struct: thrift_map_entry
      repeat_count: "{count <= remaining ? count : remaining}"
      description: "エントリの並び（残りのバイト数を上限にする）"

  thrift_map_entry:
    - name: key
      type: switch
      switch_on: "{key_type}"
      cases:
        "1": thrift_i8
        "2": thrift_i8
        "3": thrift_i8
        "4": thrift_varint
        "5": thrift_varint
        "6": thrift_varint
        "7": thrift_double
        "8": thrift_binary
        "9": thrift_list
        "10": thrift_list
        "11": thrift_map
        "12": thrift_struct
        "13": thrift_uuid
      default: thrift_unknown
      description: "キー"
    - name: map_value
      type: switch
      switch_on: "{value_type}"
      cases:
        "1": thrift_i8
        "2": thrift_i8
        "3": thrift_i8
        "4": thrift_varint
        "5": thrift_varint
        "6": thrift_varint
        "7": thrift_double
        "8": thrift_binary
        "9": thrift_list
        "10": thrift_list
        "11": thrift_map
        "12": thrift_struct
        "13": thrift_uuid
      default: thrift_unknown
      description: "値"

  thrift_unknown:
    - name: data
      type: bytes
      size: remaining
      description: "型の分からない値（以降は読めない）"
